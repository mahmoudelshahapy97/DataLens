# Continuous delivery.
#
#   ci        the whole of ci.yml; nothing ships that fails it
#   publish   build both images and push them to Docker Hub, tagged by commit SHA
#   deploy    over SSH: pull those exact images on the host and restart the stack,
#             rolling back to the previous release if it does not become ready
#
# Secrets (Settings -> Secrets and variables -> Actions):
#
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN   push here, pull on the host
#   DEPLOY_HOST, DEPLOY_USER              where to SSH, port 22
#   DEPLOY_SSH_KEY                        private key; its public half in authorized_keys
#   DEPLOY_HOST_FINGERPRINT               the host key's SHA256 fingerprint, from
#                                           ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub
#   DEPLOY_PATH                           absolute directory holding the host's .env
#
# Optional variable PUBLIC_URL (e.g. https://example.com): when set, the deploy is
# also checked from outside, through whatever proxy fronts the host.
#
# The application's own secrets never pass through here. They live in
# $DEPLOY_PATH/.env on the host; see .github/scripts/deploy.sh for what else the
# host needs before the first run.

name: Deploy

on:
  push:
    branches: [main]
    # Later patterns win: skip prose, but the curated knowledge under
    # backend/projects is configuration even though it is markdown.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!artifacts/**'
      - 'backend/projects/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a deploy halfway through; queue the next one behind it.
  group: deploy-prod
  cancel-in-progress: false

env:
  BACKEND_REPO: datalens-backend
  FRONTEND_REPO: datalens-frontend

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          # Repository root: the image carries database/migrations too.
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_REPO }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_REPO }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_REPO }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_REPO }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=()
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_HOST_FINGERPRINT DEPLOY_PATH \
                   DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Trust the host key, and only that one
        # ssh-keyscan alone would trust whoever answers; the fingerprint secret is
        # what turns it into verification.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          want=${DEPLOY_HOST_FINGERPRINT#SHA256:}
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 15 "$DEPLOY_HOST" > scanned 2>/dev/null || true
          while read -r line; do
            case $line in ''|'#'*) continue ;; esac
            fp=$(ssh-keygen -lf - <<<"$line" | awk '{print $2}')
            if [ "${fp#SHA256:}" = "$want" ]; then
              echo "$line" >> ~/.ssh/known_hosts
            fi
          done < scanned
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::No host key from DEPLOY_HOST matches DEPLOY_HOST_FINGERPRINT"
            exit 1
          fi

          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      - name: Upload the release bundle
        # The compose files and backend/projects, the one host bind mount. Code
        # arrives in the images.
        run: |
          tar -czf "bundle-$GITHUB_SHA.tgz" docker-compose.yml docker-compose.prod.yml backend/projects
          ssh deploy "mkdir -p $(printf %q "$DEPLOY_PATH/.deploy")"
          scp "bundle-$GITHUB_SHA.tgz" .github/scripts/deploy.sh "deploy:$DEPLOY_PATH/.deploy/"

      - name: Deploy
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          backend="$DOCKERHUB_USERNAME/$BACKEND_REPO:$GITHUB_SHA"
          frontend="$DOCKERHUB_USERNAME/$FRONTEND_REPO:$GITHUB_SHA"
          # The token goes over stdin, never onto a command line.
          ssh deploy "cd $(printf %q "$DEPLOY_PATH") && bash .deploy/deploy.sh \
            .deploy/bundle-$GITHUB_SHA.tgz $(printf %q "$backend") $(printf %q "$frontend") \
            $(printf %q "$DOCKERHUB_USERNAME")" <<<"$DOCKERHUB_TOKEN"

      - name: Health check from outside
        if: vars.PUBLIC_URL != ''
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          url="${PUBLIC_URL%/}/ready"
          for _ in $(seq 1 30); do
            if curl -fsS -m 10 -o /dev/null "$url"; then
              echo "$url is ready"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$url did not become ready"
          exit 1

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
