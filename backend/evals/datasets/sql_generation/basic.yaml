# Trajectory dataset for the Chinook demo workspace.
#
# The previous version of this file asserted on tools named `generate_sql` and
# `execute_query`, neither of which has ever existed in this codebase -- the
# tool is `run_sql`. Every trajectory assertion in it failed, so the dataset
# reported a total failure regardless of how the agent behaved, and was
# therefore useless as a baseline.
#
# It also asserted that the final answer contains "SELECT", "SUM" and
# "GROUP BY". `ANSWER_RULES` in `vanna/core/system_prompt/analyst.py`
# explicitly instruct the model to interpret the result rather than repeat the
# query, so those assertions tested for the opposite of the intended behaviour.
# Answer-content assertions here are now about the *answer*.
#
# Scope: this file checks **which tools the agent reaches for**, which is what
# a trajectory dataset is good at. It deliberately does not check numeric
# correctness -- `qa.json` at the repository root is the corpus for that, with
# 40 questions carrying both an expected answer and reference SQL.
#
# Schema: Chinook, as seeded by `backend/tools/seed_database.py`. Tables are
# `chinook.artist`, `album`, `track`, `genre`, `customer`, `invoice`,
# `invoice_line`, `employee`, `playlist_track`.

dataset:
  name: "SQL Generation - Chinook"
  description: >
    Does the agent reach for the right tools on the Chinook demo warehouse?
    Trajectory only; numeric correctness lives in qa.json.

  test_cases:
    # --- Baseline: a question needing nothing but a query -----------------
    - id: "sql_001"
      user_id: "eval_user"
      username: "evaluator"
      email: "eval@example.com"
      user_groups: ["user", "analyst"]
      message: "How many tracks are in the catalogue?"
      expected_outcome:
        tools_called: ["run_sql"]
        # A count, not a query. The model is told to interpret, not repeat.
        final_answer_not_contains: ["SELECT", "GROUP BY"]
        max_execution_time_ms: 30000
      metadata:
        category: "aggregation"
        difficulty: "easy"

    - id: "sql_002"
      user_id: "eval_user"
      username: "evaluator"
      email: "eval@example.com"
      user_groups: ["user", "analyst"]
      message: "Which five artists have the most tracks?"
      expected_outcome:
        tools_called: ["run_sql"]
        max_execution_time_ms: 45000
      metadata:
        category: "ranking"
        difficulty: "medium"

    # --- Joins: artist and track have no direct relationship -------------
    - id: "joins_001"
      user_id: "eval_user"
      username: "evaluator"
      email: "eval@example.com"
      user_groups: ["user", "analyst"]
      message: "What is the total revenue per artist?"
      expected_outcome:
        # artist -> album -> track -> invoice_line is four hops. Guessing the
        # path is the failure `suggest_joins` exists to remove.
        tools_called: ["suggest_joins", "run_sql"]
        max_execution_time_ms: 60000
      metadata:
        category: "multi_hop_join"
        difficulty: "hard"

    # --- Profiling: a column whose contents change the right query --------
    - id: "profile_001"
      user_id: "eval_user"
      username: "evaluator"
      email: "eval@example.com"
      user_groups: ["user", "analyst"]
      message: "What is the average length of a track?"
      expected_outcome:
        tools_called: ["run_sql"]
        max_execution_time_ms: 45000
      metadata:
        category: "aggregate_over_nullable"
        difficulty: "medium"

    # --- Time series -----------------------------------------------------
    - id: "trend_001"
      user_id: "eval_user"
      username: "evaluator"
      email: "eval@example.com"
      user_groups: ["user", "analyst"]
      message: "Is our monthly revenue growing or shrinking over time?"
      expected_outcome:
        # "Growing or shrinking" is a question about a trend, not a table of
        # months. Answering it by eye is the failure analyze_timeseries removes.
        tools_called: ["analyze_timeseries"]
        max_execution_time_ms: 60000
      metadata:
        category: "trend"
        difficulty: "medium"

    # --- Period comparison -----------------------------------------------
    - id: "compare_001"
      user_id: "eval_user"
      username: "evaluator"
      email: "eval@example.com"
      user_groups: ["user", "analyst"]
      message: "How did revenue by genre in 2012 compare with 2011?"
      expected_outcome:
        tools_called: ["compare_periods"]
        max_execution_time_ms: 60000
      metadata:
        category: "period_comparison"
        difficulty: "hard"

    # --- Ambiguity: must ask, not guess ----------------------------------
    - id: "clarify_001"
      user_id: "eval_user"
      username: "evaluator"
      email: "eval@example.com"
      user_groups: ["user", "analyst"]
      message: "Show me our top customers"
      expected_outcome:
        # "Top" could mean by spend or by number of invoices, and the two give
        # different customers. The agent should ask rather than pick one.
        tools_called: ["request_clarification"]
        tools_not_called: ["run_sql"]
        max_execution_time_ms: 30000
      metadata:
        category: "ambiguous"
        difficulty: "medium"

    - id: "clarify_002"
      user_id: "eval_user"
      username: "evaluator"
      email: "eval@example.com"
      user_groups: ["user", "analyst"]
      message: "How many customers are there?"
      expected_outcome:
        # The counterweight to clarify_001: an unambiguous question must not
        # trigger a clarification. A tool that fires on everything is worse
        # than no tool.
        tools_called: ["run_sql"]
        tools_not_called: ["request_clarification"]
        max_execution_time_ms: 30000
      metadata:
        category: "unambiguous"
        difficulty: "easy"

    # --- Visualisation ---------------------------------------------------
    - id: "viz_001"
      user_id: "eval_user"
      username: "evaluator"
      email: "eval@example.com"
      user_groups: ["user", "analyst"]
      message: "Chart the number of invoices per country."
      expected_outcome:
        tools_called: ["run_sql", "visualize_data"]
        max_execution_time_ms: 60000
      metadata:
        category: "visualization"
        difficulty: "medium"

    # --- Out of scope: must decline rather than invent --------------------
    - id: "scope_001"
      user_id: "eval_user"
      username: "evaluator"
      email: "eval@example.com"
      user_groups: ["user", "analyst"]
      message: "What is our staff headcount forecast for next year?"
      expected_outcome:
        # Chinook has an employee table but no forecast. NON_DATA_RULES say to
        # state plainly that it is outside what the database covers.
        tools_not_called: ["run_sql"]
        max_execution_time_ms: 30000
      metadata:
        category: "out_of_scope"
        difficulty: "medium"
