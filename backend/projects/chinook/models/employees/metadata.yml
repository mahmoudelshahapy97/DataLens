name: employees
description: >-
  Staff. Sales reps are the employees customers.support_rep_id points at, so
  "which rep sells the most" is grouped through customers, not invoices.
table_reference: chinook.employee
columns:
  - name: employee_id
    type: INTEGER
    is_primary_key: true
  - name: first_name
    type: VARCHAR
  - name: last_name
    type: VARCHAR
  - name: full_name
    type: VARCHAR
    is_calculated: true
    expression: first_name || ' ' || last_name
  - name: title
    type: VARCHAR
  - name: hire_date
    type: TIMESTAMP
  - name: city
    type: VARCHAR
  - name: country
    type: VARCHAR
  - name: email
    type: VARCHAR
  - name: reports_to
    type: INTEGER
    is_hidden: true
