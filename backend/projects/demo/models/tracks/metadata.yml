name: tracks
description: >-
  One row per track in the catalogue. Length and file size are stored in
  milliseconds and bytes; the calculated columns below are what people mean.
table_reference: chinook.track
columns:
  - name: track_id
    type: INTEGER
    is_primary_key: true
  - name: name
    type: VARCHAR
    description: Track title.
  - name: composer
    type: VARCHAR
  - name: album_id
    type: INTEGER
    is_hidden: true
  - name: genre_id
    type: INTEGER
    is_hidden: true
  - name: media_type_id
    type: INTEGER
    is_hidden: true
  - name: unit_price
    type: NUMERIC
    description: List price in dollars.
  - name: milliseconds
    type: INTEGER
    is_hidden: true
  - name: minutes
    type: DOUBLE
    is_calculated: true
    expression: milliseconds / 60000.0
    description: Track length in minutes. Nobody asks for milliseconds.
  - name: bytes
    type: INTEGER
    is_hidden: true
  - name: megabytes
    type: DOUBLE
    is_calculated: true
    expression: bytes / 1048576.0
    description: File size in MB.
