# Vanna — full stack, querying the shared multi-database sandbox.
#
# PREREQUISITE: the sandbox must be running first. It owns the Docker network this
# stack joins, so starting out of order fails immediately with
# "network multidb_network declared as external, but could not be found".
#
#   cd ../../databases && docker compose up -d
#   docker compose up --build
#
# The vector store is a third stack, ../../vector_db, and is only needed when
# VANNA_INDEX_BACKEND names a vector backend. It joins the same sandbox network:
#
#   cd ../../vector_db && docker compose up -d
#
#   App     http://localhost:3000        chat, schema, history, saved queries
#   Console http://localhost:3000/admin/ workspaces, members, knowledge review
#
# Sign in at the app as `demo@example.com`. On a first start with no
# VANNA_ADMIN_PASSWORD set, a password is generated and printed once in the API log:
#
#   docker compose logs backend | grep -A4 "First-run administrator"
#
# That account is the platform admin: it can create more workspaces, bind each to a
# different one of the eight seeded datasets, and invite members with
# admin / analyst / viewer roles. Each workspace queries only its own database.
#
# This file runs the stack in `single-tenant` mode, which is the honest description
# of a local sandbox: real accounts and real limits, but plain HTTP and a published
# API port. See .env.example for what `multi-tenant` additionally requires -- the API
# refuses to start in that mode until every one of those is right.

services:
  # Named after the directory it is built from. The three top-level directories --
  # backend/, frontend/, database/ -- and the services here use the same words, so
  # `docker compose logs backend` needs no translation step.
  backend:
    build:
      # Repository root, not backend/: the image also carries database/migrations,
      # which VANNA_AUTO_MIGRATE applies at boot.
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # -- Mode. The single most important setting here.
      #
      #    demo           anonymous access, per-process limits, no checks
      #    single-tenant  real accounts, real limits, one workspace expected
      #    multi-tenant   the product; every permissive default is refused at boot
      #
      #    Anything unrecognised is treated as multi-tenant, so a typo fails closed.
      VANNA_DEPLOYMENT_MODE: ${VANNA_DEPLOYMENT_MODE:-single-tenant}

      # -- Secrets. Encrypts stored datasource credentials and signs CSRF and OIDC
      #    state. Generate with:
      #      python -c "import secrets;print(secrets.token_urlsafe(48))"
      #    The default below is a *known* value and is only acceptable on a laptop.
      VANNA_SECRET_KEY: ${VANNA_SECRET_KEY:-dev-only-insecure-key-replace-me-before-any-real-deployment}

      # -- LLM. 'auto' picks whichever key is present, else the mock service.
      VANNA_LLM_PROVIDER: ${VANNA_LLM_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # -- Database. Reaches `db_postgres` by container name over the shared sandbox
      #    network. Must not be left empty: an empty value means "use the built-in
      #    SQLite demo" and would silently query toy data instead of failing.
      VANNA_DATABASE_URL: ${VANNA_DATABASE_URL:-postgresql://postgres:postgres123@db_postgres:5432/chinook}
      VANNA_SQLITE_PATH: /data/demo.db

      # -- Control plane. Tenants, members, roles, sessions, saved queries, starter
      #    questions, the generation log, the audit trail and the shared counters all
      #    live here. A separate database from the one being queried, on purpose: the
      #    analytics connection is read-only and belongs to the customer, and our
      #    bookkeeping has no business in it. Created on first start if absent.
      VANNA_APP_DATABASE_URL: ${VANNA_APP_DATABASE_URL:-postgresql://postgres:postgres123@db_postgres:5432/vanna_app}
      VANNA_DEFAULT_TENANT: ${VANNA_DEFAULT_TENANT:-demo}
      # Schema migrations run at boot here -- the numbered files in
      # database/migrations. Set false and run
      # `python -m vanna_app.migrate upgrade` as a deploy job once more than one
      # replica starts at a time.
      VANNA_AUTO_MIGRATE: ${VANNA_AUTO_MIGRATE:-true}
      # -- The connection budget.
      #
      #    Every pool below is PER WORKER PROCESS, and this image runs four. The
      #    ceiling is therefore
      #
      #        workers x (APP_POOL_MAX + MAX_TENANT_RUNTIMES x WAREHOUSE_POOL_MAX)
      #        4       x (16           + 2                   x 2                ) = 80
      #
      #    against a server whose max_connections is typically 100 -- and in this
      #    compose file the control plane and every warehouse are the SAME server,
      #    so they share that number. Exhaust it and the error is
      #    `FATAL: sorry, too many clients already`, which takes sign-in down with
      #    it, because authentication needs the control plane.
      #
      #    Every default here was measured with backend/tools/load_probe.py, 27 concurrent
      #    users over nine workspaces:
      #
      #      APP_POOL_MAX 16 -> 8      mean wait per acquisition 0.09ms -> 164ms.
      #                                Halving this pool was the whole of a p95
      #                                regression from 1.9s to 4.0s. Put back.
      #      WAREHOUSE_POOL_MAX 5 -> 2 each cached runtime sat on ~4.7 idle
      #                                connections it never gave back; capping cost
      #                                nothing measurable.
      #      WEB_CONCURRENCY 4         two workers tripled median latency (123ms ->
      #                                616ms) and saved no connections.
      #      MAX_TENANT_RUNTIMES 2     what is left once the ceiling has to fit 80.
      #
      #    Observed usage is far below the ceiling in all of them -- 24 to 32
      #    connections, because pools are lazy and the cache is an LRU. The ceiling
      #    is the worst case, and the worst case is what takes sign-in down.
      #
      #    WEB_CONCURRENCY must match `--workers` in backend/Dockerfile; the
      #    application cannot read it, and it multiplies every term.
      VANNA_APP_POOL_MAX: ${VANNA_APP_POOL_MAX:-16}
      VANNA_APP_STATEMENT_TIMEOUT_MS: ${VANNA_APP_STATEMENT_TIMEOUT_MS:-15000}
      VANNA_WAREHOUSE_POOL_MAX: ${VANNA_WAREHOUSE_POOL_MAX:-2}
      VANNA_WAREHOUSE_POOL_MIN: ${VANNA_WAREHOUSE_POOL_MIN:-0}
      VANNA_WEB_CONCURRENCY: ${VANNA_WEB_CONCURRENCY:-4}
      VANNA_CONNECTION_BUDGET: ${VANNA_CONNECTION_BUDGET:-80}
      # Threads for blocking work. Every control-plane query, warehouse query
      # and example search runs here, so it should comfortably exceed the pool
      # sizes above or threads become the bottleneck the pools were sized to
      # avoid. Python's default is cpu_count+4, which relates to nothing here.
      VANNA_THREAD_POOL_MAX: ${VANNA_THREAD_POOL_MAX:-32}

      # How long an idle per-workspace runtime is kept before it is rebuilt. Same
      # story as VANNA_ALLOW_ANONYMOUS below: documented and read, never passed in.
      VANNA_TENANT_RUNTIME_TTL_SECONDS: ${VANNA_TENANT_RUNTIME_TTL_SECONDS:-1800}

      # -- Access. Platform admins create and delete workspaces and administer any of
      #    them. Workspace-level admins are rows in the directory instead.
      #
      #    An empty list now means *nobody* is a platform admin, not everybody --
      #    which is the opposite of what it used to mean, and the reason this stack
      #    could previously be turned into a single shared workspace by unsetting one
      #    variable.
      VANNA_ADMIN_EMAILS: ${VANNA_ADMIN_EMAILS:-demo@example.com}

      # Which hops in X-Forwarded-For may be believed. nginx sits on the compose
      # bridge network, so its address is in 172.16/12. Without this the header is
      # ignored entirely and every request appears to come from the proxy -- which
      # would make per-IP login throttling lock out all users at once.
      VANNA_TRUSTED_PROXIES: ${VANNA_TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}

      # Lets the sign-in screen list a workspace's members so they can be picked
      # rather than typed. Convenient for a demo, an email-address disclosure
      # anywhere else -- and refused outright in multi-tenant mode.
      VANNA_PUBLIC_USER_DIRECTORY: ${VANNA_PUBLIC_USER_DIRECTORY:-true}

      # No authentication at all. Documented in .env.example and read by
      # config.py, but it used to be absent here -- and with no `env_file:` on this
      # service, a variable that is not named is a variable the container never
      # sees. Setting it in .env appeared to do nothing.
      VANNA_ALLOW_ANONYMOUS: ${VANNA_ALLOW_ANONYMOUS:-false}

      # -- Storage. On a named volume, so a rebuild keeps the catalog and knowledge.
      VANNA_DATA_DIR: /data
      VANNA_KNOWLEDGE_DIR: /data/knowledge

      # -- Guardrails
      VANNA_MAX_ROWS: ${VANNA_MAX_ROWS:-1000}
      VANNA_QUERY_TIMEOUT: ${VANNA_QUERY_TIMEOUT:-60}
      VANNA_DAILY_QUOTA: ${VANNA_DAILY_QUOTA:-200}
      VANNA_RATE_LIMIT_PER_MIN: ${VANNA_RATE_LIMIT_PER_MIN:-20}
      VANNA_GENERATION_RETENTION_DAYS: ${VANNA_GENERATION_RETENTION_DAYS:-365}
      # Was 32, chosen before a runtime held a connection pool of its own. Each
      # one now costs up to VANNA_WAREHOUSE_POOL_MAX connections per worker, so it
      # is a term in the budget above rather than a free cache size.
      #
      # Two is small for a deployment with nine workspaces -- it means most
      # requests rebuild a runtime, which showed up as a p99 of 5.0s against 3.5s
      # with a large cache. It is what fits an 80 budget at four workers. If your
      # server has room, raise THIS AND THE BUDGET TOGETHER after checking
      # `SHOW max_connections` and measuring with backend/tools/load_probe.py; raising it
      # alone just moves the ceiling above the budget and earns a warning.
      VANNA_MAX_TENANT_RUNTIMES: ${VANNA_MAX_TENANT_RUNTIMES:-2}

      # -- Semantic layer. A manifest describes ONE database, so it is bound to the
      #    workspace whose database it describes:
      #
      #      VANNA_PROJECT_DIR   applies to the default workspace only.
      #      VANNA_PROJECTS_DIR  a directory of projects, one per workspace, at
      #                          <root>/<tenant_id>/. Use this once there is more
      #                          than one workspace.
      VANNA_PROJECT_DIR: ${VANNA_PROJECT_DIR:-/project}
      VANNA_PROJECTS_DIR: ${VANNA_PROJECTS_DIR:-/projects}

      # -- Where configuration is read from.
      #
      #      disk      the YAML tree in the image. What this stack did before the
      #                catalog existed.
      #      database  the `config_files` table. Disk is never consulted, so an
      #                administrator editing a cube in the console changes what
      #                runs -- and a failed import fails loudly instead of quietly
      #                serving whatever the image shipped with.
      #
      #    `database` here with BOOTSTRAP on: the first boot on a fresh volume
      #    imports the files under /app, once, under an advisory lock, and says so
      #    in the log. After that the catalog is authoritative and a restart does
      #    not reinstate the files -- the bootstrap only ever fills an EMPTY
      #    catalog. Re-import deliberately with backend/tools/import_config_files.py.
      VANNA_CONFIG_SOURCE: ${VANNA_CONFIG_SOURCE:-database}
      VANNA_CONFIG_BOOTSTRAP: ${VANNA_CONFIG_BOOTSTRAP:-true}
      # Four workers, four caches. This bounds how long an edit takes to reach the
      # three that did not take the write.
      VANNA_CONFIG_REFRESH_SECONDS: ${VANNA_CONFIG_REFRESH_SECONDS:-5}

      # Retrieval ranking. `qdrant` fuses semantic search into BM25 by reciprocal
      # rank fusion; `lexical` is keyword-only and needs neither a vector store nor
      # an API key. Two things have to be true for the default here to hold: the
      # ../../vector_db stack is up, and OPENAI_API_KEY above is set. With either
      # missing the API still starts and logs a downgrade to lexical -- retrieval
      # gets worse rather than the stack failing, so check the effective backend on
      # /api/vanna/v2/schema when answers degrade for no obvious reason.
      VANNA_INDEX_BACKEND: ${VANNA_INDEX_BACKEND:-qdrant}
      # Served by the ../../vector_db stack over the shared sandbox network, not by
      # a service in this file -- `qdrant` is that stack's service name, which
      # Compose registers as an alias on every network it joins. See the note where
      # the qdrant service used to be.
      VANNA_QDRANT_URL: ${VANNA_QDRANT_URL:-http://qdrant:6333}
      # Empty for the sandbox: that stack binds Qdrant to loopback and runs it with
      # authentication off. Required for any Qdrant reachable from further away --
      # a managed cluster, or one published beyond 127.0.0.1 -- because Qdrant's
      # read/write API is entirely unauthenticated without it.
      VANNA_QDRANT_API_KEY: ${VANNA_QDRANT_API_KEY:-}

      # Embeddings come from the OpenAI API: nothing resident in the workers,
      # nothing downloaded at boot, and a round trip plus a per-token charge on
      # every index pass and every query. OPENAI_API_KEY above is therefore
      # required whenever VANNA_INDEX_BACKEND names a vector backend -- without it
      # the API still starts and serves keyword-only BM25.
      VANNA_EMBED_PROVIDER: ${VANNA_EMBED_PROVIDER:-openai}
      VANNA_EMBED_MODEL: ${VANNA_EMBED_MODEL:-text-embedding-3-small}
      VANNA_EMBED_DIMENSIONS: ${VANNA_EMBED_DIMENSIONS:-}
      # Changing embedding model makes the existing collection unusable; it is
      # derived from knowledge/, so rebuilding it loses nothing.
      VANNA_QDRANT_RECREATE_ON_MISMATCH: ${VANNA_QDRANT_RECREATE_ON_MISMATCH:-false}

      # -- Authentication. Password + session cookie. The first admin is seeded on an
      #    empty install; leave the password unset and one is generated and logged
      #    once. Header auth is off unless deliberately re-enabled, and is refused
      #    outright in multi-tenant mode.
      VANNA_AUTH_METHODS: ${VANNA_AUTH_METHODS:-password}
      VANNA_ADMIN_PASSWORD: ${VANNA_ADMIN_PASSWORD:-}
      VANNA_TRUST_HEADERS: ${VANNA_TRUST_HEADERS:-false}
      VANNA_SECURE_COOKIES: ${VANNA_SECURE_COOKIES:-false}
      VANNA_SESSION_TTL_HOURS: ${VANNA_SESSION_TTL_HOURS:-72}
      VANNA_LOGIN_MAX_ATTEMPTS: ${VANNA_LOGIN_MAX_ATTEMPTS:-8}
      VANNA_LOGIN_WINDOW_SECONDS: ${VANNA_LOGIN_WINDOW_SECONDS:-300}
      VANNA_PUBLIC_BASE_URL: ${VANNA_PUBLIC_BASE_URL:-http://localhost:3000}

      # -- Single sign-on. Off unless VANNA_AUTH_METHODS names oidc.
      VANNA_OIDC_ISSUER: ${VANNA_OIDC_ISSUER:-}
      VANNA_OIDC_CLIENT_ID: ${VANNA_OIDC_CLIENT_ID:-}
      VANNA_OIDC_CLIENT_SECRET: ${VANNA_OIDC_CLIENT_SECRET:-}
      VANNA_OIDC_ROLE_CLAIM: ${VANNA_OIDC_ROLE_CLAIM:-}
      VANNA_OIDC_AUTO_PROVISION_TENANT: ${VANNA_OIDC_AUTO_PROVISION_TENANT:-}
      VANNA_OIDC_SCOPES: ${VANNA_OIDC_SCOPES:-openid email profile}

      # -- Mail. With no host, messages are written to the log instead of sent, so
      #    the reset and invitation flows are exercisable without a mail server.
      VANNA_SMTP_HOST: ${VANNA_SMTP_HOST:-}
      VANNA_SMTP_PORT: ${VANNA_SMTP_PORT:-587}
      VANNA_SMTP_USERNAME: ${VANNA_SMTP_USERNAME:-}
      VANNA_SMTP_PASSWORD: ${VANNA_SMTP_PASSWORD:-}
      VANNA_SMTP_FROM: ${VANNA_SMTP_FROM:-vanna@localhost}

      # -- Billing. Plans are code constants; only the provider is configurable, and
      #    `manual` is the only implementation.
      VANNA_PAYMENT_PROVIDER: ${VANNA_PAYMENT_PROVIDER:-manual}

      VANNA_ALLOW_WRITES: ${VANNA_ALLOW_WRITES:-false}
      VANNA_SCAN_ON_START: ${VANNA_SCAN_ON_START:-true}
      VANNA_CORS_ORIGINS: ${VANNA_CORS_ORIGINS:-http://localhost:3000}

      # -- Observability
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # `json` for a log shipper, `text` for a human reading `docker compose logs`.
      VANNA_LOG_FORMAT: ${VANNA_LOG_FORMAT:-text}
      VANNA_METRICS_ENABLED: ${VANNA_METRICS_ENABLED:-true}
      VANNA_SENTRY_DSN: ${VANNA_SENTRY_DSN:-}
    volumes:
      - vanna-data:/data
      # Read-only: the manifest is built on the host and reviewed in git; the
      # container consumes it and never rewrites it. Bind-mounted rather than baked
      # into the image so editing a cube does not need a rebuild.
      - ./backend/projects/chinook:/project:ro
      - ./backend/projects:/projects:ro
    networks:
      # `default` for nginx -> backend; `sandbox` to reach db_postgres.
      - default
      - sandbox
    # No published port. The API is reached through nginx, which is what makes
    # VANNA_TRUSTED_PROXIES meaningful -- with 8000 exposed to the host, anyone could
    # set X-Forwarded-For directly and bypass per-IP throttling. Uncomment for
    # /docs while developing, and understand what it costs.
    #
    # ports:
    #   - "8000:8000"
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    # Modest hardening: the process runs as uid 10001 and needs no new privileges,
    # so say so rather than relying on the image alone.
    security_opt:
      - no-new-privileges:true

  # No qdrant service here. The vector store is its own stack, at
  # ../../vector_db, so the collection outlives a `docker compose down -v` of this
  # one and can be shared rather than duplicated. It joins the same sandbox
  # network, so `qdrant` resolves from the API exactly as it did in-stack and
  # VANNA_QDRANT_URL above is unchanged.
  #
  # Whether it has to be up depends on VANNA_INDEX_BACKEND, which defaults to
  # `qdrant` above -- so in the normal case it does. The API still starts without
  # it: resolve_index logs a downgrade and serves keyword-only BM25, so retrieval
  # quietly gets worse rather than the stack failing. The same happens with the
  # store up but OPENAI_API_KEY unset, because there is no local embedder to fall
  # back to. /api/vanna/v2/schema reports the backend actually in use, which is the
  # thing to check when answers degrade for no obvious reason.
  #
  # Compose cannot express a depends_on across projects, so start order is on you:
  # bring ../../vector_db up before this stack, or restart `backend` afterwards.

  frontend:
    build:
      # frontend/ alone, because the image needs nothing outside it. It used to be
      # the repository root, only so the build could read the Python package
      # version out of pyproject.toml.
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        # Wait for healthy, not just started. nginx resolves the `backend` upstream
        # at startup and fails hard if the name is not yet resolvable, which turns a
        # slow API boot into a dead web container.
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

# No database service here. PostgreSQL comes from the sandbox project, which already
# serves eight seeded datasets and owns port 5432.

networks:
  # Created implicitly for frontend -> backend.
  default:

  # Owned by the sibling `databases` project. `external` means join it,
  # never create it, so this stack can never silently start a second, empty network
  # that resolves no database names.
  sandbox:
    external: true
    name: multidb_network

volumes:
  vanna-data:
