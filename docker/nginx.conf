# Serves the UI and proxies the API, so the browser sees one origin.
#
# Same-origin is the point. It removes CORS entirely, lets cookies reach the
# API without SameSite trouble, and means the frontend can call /api/... with
# no configured base URL.

upstream vanna_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed bundle filenames -- safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Interface translations. Needs its own block because the catch-all below
    # ends in `try_files ... /index.html`, which would answer a missing
    # dictionary with the HTML page and a 200 -- the fetch then fails to parse
    # and the interface silently falls back to rendering raw keys like
    # "nav.account". A 404 is the honest answer and shows up in the console.
    location /locales/ {
        try_files $uri =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # HTML is never cached. The bundle under /assets/ has a hashed name and
        # is immutable, but index.html keeps the same URL forever -- so without
        # this a browser serves yesterday's page after a deploy, and every fix
        # looks like it did not ship. That is a genuinely expensive class of
        # confusion: the user reports a bug that was fixed hours ago.
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location /api/ {
        proxy_pass http://vanna_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Server-Sent Events ---------------------------------------
        # Streaming is the whole user experience here, and nginx defaults
        # actively break it: proxy_buffering holds the response until a buffer
        # fills, so tokens arrive in bursts or not at all. These four lines are
        # what make the chat stream rather than hang and then dump.
        proxy_buffering     off;
        proxy_cache         off;
        proxy_set_header    Connection '';
        chunked_transfer_encoding off;

        # A long analytical query can legitimately run for minutes. The
        # default 60s would sever the connection mid-answer.
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    location = /health {
        proxy_pass http://vanna_api/health;
        access_log off;
    }

    # Modest hardening. Not a substitute for auth -- see the resolver note in
    # docker/app.py.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
}
