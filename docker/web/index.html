<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vanna — Ask your data</title>

<!--
  The Vanna workspace.

  Six screens over one API: Ask (the chat), Schema, History, Saved queries,
  Dashboards, and the identity/workspace controls that tie them to a tenant. Everything is
  scoped to the workspace the user signed in to; the backend enforces that
  scoping and this page merely reflects it.

  Dependency-free on purpose. The only built asset is the <vanna-chat> web
  component bundle, loaded locally rather than from the CDN so the container
  runs the code in this repository. Adding a framework here would mean a second
  build pipeline to serve six screens that are mostly lists.

  Identity: the demo backend reads X-User-Email / X-Tenant-Id. Those headers are
  attached to every call, including the chat component's. A real deployment
  replaces the sign-in screen with its own auth and deletes the header code --
  see the resolver note in docker/app.py.
-->
<script type="module" src="/assets/vanna-components.js"></script>

<style>
  :root {
    --bg:        #f1f5f9;
    --surface:   #ffffff;
    --surface-2: #f8fafc;
    --border:    #e2e8f0;
    --text:      #0f172a;
    --muted:     #64748b;
    --primary:   #4f46e5;
    --primary-fg:#ffffff;
    --good:      #059669;
    --bad:       #dc2626;
    --warn:      #d97706;
    --radius:    10px;
    --sidebar:   232px;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg:        #0b1120;
    --surface:   #111827;
    --surface-2: #0f172a;
    --border:    #1f2937;
    --text:      #e5e7eb;
    --muted:     #94a3b8;
    --primary:   #6366f1;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--primary); }

  /* ---------------------------------------------------------- shell --- */
  #app { display: none; height: 100vh; grid-template-rows: auto 1fr; }
  #app.ready { display: grid; }

  header.top {
    display: flex; align-items: center; gap: 12px; padding: 10px 18px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 680; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  .brand .dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--primary);
  }
  .grow { flex: 1; }

  .pill {
    display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2);
    font-size: .8125rem; cursor: pointer;
  }
  .pill:hover { border-color: var(--primary); }
  .pill .sub { color: var(--muted); }

  .chip {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: .6875rem; font-weight: 650; text-transform: uppercase; letter-spacing: .03em;
    background: rgba(148,163,184,.18); color: var(--muted);
  }
  .chip.admin  { background: rgba(79,70,229,.15);  color: var(--primary); }
  .chip.ok     { background: rgba(5,150,105,.15);  color: var(--good); }
  .chip.err    { background: rgba(220,38,38,.15);  color: var(--bad); }
  .chip.warn   { background: rgba(217,119,6,.15);  color: var(--warn); }

  .body { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 0; }

  nav.side {
    background: var(--surface); border-right: 1px solid var(--border);
    padding: 14px 10px; display: flex; flex-direction: column; gap: 3px; min-height: 0;
  }
  nav.side button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 9px 12px; border: 0; border-radius: 8px; background: transparent;
    cursor: pointer; font-size: .9rem;
  }
  nav.side button:hover { background: var(--surface-2); }
  nav.side button[aria-current="true"] {
    background: color-mix(in srgb, var(--primary) 12%, transparent);
    color: var(--primary); font-weight: 600;
  }
  nav.side .spacer { flex: 1; }
  .threads { margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .threads .new-chat {
    width: 100%; padding: 8px 12px; border: 1px dashed var(--border);
    border-radius: 8px; background: transparent; cursor: pointer;
    font-size: .8125rem; color: var(--muted); margin-bottom: 6px;
  }
  .threads .new-chat:hover { border-color: var(--primary); color: var(--primary); }
  #thread-list { max-height: 210px; overflow: auto; }
  .thread {
    display: flex; align-items: center; gap: 6px; padding: 6px 10px;
    border-radius: 7px; cursor: pointer; font-size: .8125rem;
  }
  .thread:hover { background: var(--surface-2); }
  .thread[aria-current="true"] {
    background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary);
  }
  .thread .label {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .thread .menu {
    border: 0; background: transparent; cursor: pointer; color: var(--muted);
    opacity: 0; padding: 0 2px;
  }
  .thread:hover .menu { opacity: 1; }
  nav.side .note { padding: 10px 12px; font-size: .75rem; color: var(--muted); }

  main { min-width: 0; min-height: 0; overflow: auto; padding: 20px 24px 28px; }
  main.flush { padding: 0; overflow: hidden; }

  h2.view-title { margin: 0 0 4px; font-size: 1.15rem; }
  p.view-sub { margin: 0 0 18px; color: var(--muted); font-size: .875rem; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar input[type="search"], .toolbar input[type="text"] {
    flex: 1; min-width: 200px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
  }
  label.inline { display: inline-flex; align-items: center; gap: 6px; font-size: .8125rem; color: var(--muted); }

  button.btn {
    padding: 7px 13px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; font-size: .8125rem;
  }
  button.btn:hover { border-color: var(--primary); }
  button.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
  button.btn.danger  { border-color: var(--bad); color: var(--bad); }
  button.btn:disabled { opacity: .5; cursor: not-allowed; }

  .sql-editor {
    width: 100%; min-height: 110px; padding: 11px 13px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8125rem;
    resize: vertical;
  }
  .sql-editor:focus { outline: none; border-color: var(--primary); }

  pre.sql {
    margin: 0; padding: 11px 13px; border-radius: 8px; overflow-x: auto;
    background: var(--surface-2); border: 1px solid var(--border);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8125rem;
    white-space: pre-wrap; word-break: break-word;
  }

  table.data { width: 100%; border-collapse: collapse; font-size: .8125rem; }
  table.data th, table.data td {
    text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  table.data th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  table.data tr:last-child td { border-bottom: 0; }
  .scroll-x { overflow-x: auto; }

  .empty { text-align: center; padding: 46px 20px; color: var(--muted); }
  .muted { color: var(--muted); }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  .small { font-size: .8125rem; }

  /* ------------------------------------------------------------ ask --- */
  #view-ask { display: none; height: 100%; grid-template-rows: auto 1fr; min-height: 0; }
  #view-ask.on { display: grid; }
  .starters { padding: 14px 24px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .starters .lead { font-size: .8125rem; color: var(--muted); margin-right: 2px; }
  .starter {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; font-size: .8125rem;
  }
  .starter:hover { border-color: var(--primary); color: var(--primary); }
  .chat-wrap { padding: 14px 24px 24px; min-height: 0; }
  vanna-chat { height: 100%; display: block; }

  /* --------------------------------------------------------- schema --- */
  .schema-grid { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
  .table-list { max-height: calc(100vh - 230px); overflow: auto; }
  .table-list button {
    display: block; width: 100%; text-align: left; padding: 8px 11px; border: 0;
    border-radius: 7px; background: transparent; cursor: pointer; font-size: .875rem;
  }
  .table-list button:hover { background: var(--surface-2); }
  .table-list button[aria-current="true"] {
    background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary);
  }
  .table-list .count { float: right; color: var(--muted); font-size: .75rem; }

  /* -------------------------------------------------------- overlay --- */
  .overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.55);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 40;
  }
  .overlay.on { display: flex; }
  .sheet {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    width: min(760px, 100%); max-height: 86vh; overflow: auto; padding: 22px;
    box-shadow: 0 24px 60px rgba(2,6,23,.28);
  }
  .sheet h3 { margin: 0 0 14px; font-size: 1.05rem; }
  .sheet label { display: block; font-size: .8125rem; color: var(--muted); margin: 12px 0 5px; }
  .sheet input, .sheet select, .sheet textarea {
    width: 100%; padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-2);
  }
  .sheet textarea { min-height: 110px; font-family: ui-monospace, Menlo, monospace; font-size: .8125rem; }
  .sheet .actions { display: flex; gap: 9px; margin-top: 18px; justify-content: flex-end; }

  /* --------------------------------------------------------- signin --- */
  #signin {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: var(--bg); padding: 20px; z-index: 50;
  }
  #signin.on { display: flex; }
  #signin .panel {
    width: min(430px, 100%); background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 26px;
  }
  #signin h1 { margin: 0 0 6px; font-size: 1.25rem; }
  #signin p.lede { margin: 0 0 20px; color: var(--muted); font-size: .875rem; }
  #signin label { display: block; font-size: .8125rem; color: var(--muted); margin: 14px 0 5px; }
  #signin select, #signin input {
    width: 100%; padding: 10px 12px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface-2);
  }
  #signin button.go {
    width: 100%; margin-top: 20px; padding: 11px; border-radius: 9px; border: 0;
    background: var(--primary); color: var(--primary-fg); font-weight: 600; cursor: pointer;
  }
  .roster { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .roster button {
    padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-2); cursor: pointer; font-size: .75rem;
  }
  .roster button:hover { border-color: var(--primary); color: var(--primary); }
  .error {
    margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: .8125rem;
    background: rgba(220,38,38,.1); color: var(--bad); display: none;
  }
  .error.on { display: block; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px;
    font-size: .875rem; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 820px) {
    .body { grid-template-columns: 1fr; }
    nav.side { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); }
    nav.side .spacer, nav.side .note { display: none; }
    .schema-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ------------------------------------------------------------ sign in -->
<div id="signin">
  <div class="panel">
    <h1>Sign in to Vanna</h1>
    <p class="lede">Pick a workspace and identify yourself. Each workspace has its
      own database, its own members, and its own curated knowledge.</p>

    <label for="si-tenant">Workspace</label>
    <select id="si-tenant"></select>

    <label for="si-email">Your email</label>
    <input id="si-email" type="email" placeholder="you@example.com" autocomplete="email" />

    <label for="si-password">Password</label>
    <input id="si-password" type="password" placeholder="********"
           autocomplete="current-password" />
    <div class="roster" id="si-roster"></div>

    <button class="go" id="si-go">Continue</button>
    <div class="error" id="si-error"></div>
  </div>
</div>

<!-- --------------------------------------------------------------- app -->
<div id="app">
  <header class="top">
    <span class="brand"><span class="dot"></span> Vanna</span>

    <button class="pill" id="tenant-pill" title="Switch workspace">
      <span id="tenant-name">—</span>
      <span class="sub" id="tenant-source"></span>
    </button>

    <span class="grow"></span>

    <button class="btn" id="theme-btn" title="Toggle light/dark">Theme</button>
    <button class="pill" id="user-pill" title="Sign out">
      <span id="user-email">—</span>
      <span class="chip" id="user-role">user</span>
    </button>
  </header>

  <div class="body">
    <nav class="side">
      <div class="threads" id="threads">
        <button class="new-chat" id="new-chat">+ New chat</button>
        <div id="thread-list"></div>
      </div>
      <button data-view="ask"     aria-current="true">Ask</button>
      <button data-view="schema">Schema</button>
      <button data-view="history">History</button>
      <button data-view="saved">Saved queries</button>
      <button data-view="dashboards">Dashboards</button>
      <button data-view="cubes" id="nav-cubes" style="display:none">Metrics</button>
      <div class="spacer"></div>
      <a class="note" id="console-link" href="/admin/" style="display:none">Admin console →</a>
      <div class="note" id="usage-note"></div>
      <div class="note" id="ds-note"></div>
    </nav>

    <main id="main" class="flush">
      <!-- Ask keeps its own container so the chat element is never destroyed
           by a view switch; losing it would lose the conversation. -->
      <div id="view-ask" class="on">
        <div class="starters" id="starters"></div>
        <div class="starters" id="ask-tools" style="display:none;padding-top:6px">
          <button class="starter" id="preview-prompt" title="What is the model actually told?">
            Preview context
          </button>
        </div>
        <div class="chat-wrap" id="chat-wrap"></div>
      </div>
      <div id="view-other" style="display:none"></div>
    </main>
  </div>
</div>

<!-- --------------------------------------------------------- overlays -->
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

// ---------------------------------------------------------------- state ---

const STORAGE_KEY = 'vanna.identity';   // shared with the admin console
const THEME_KEY   = 'vanna.theme';

let identity = null;      // { tenant, email }
let me       = null;      // response from /me
let view     = 'ask';
let chatEl   = null;
let schemaCache  = null;
let historyCache = [];

const $ = (id) => document.getElementById(id);

/** Escape before interpolating into HTML.
 *  Questions, SQL, table names and user names all originate from users, an
 *  LLM, or a database schema. This is the boundary that keeps any of them from
 *  executing as markup in someone else's browser. */
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

/** Turn any error payload into one readable line. */
function errorText(detail, fallback) {
  if (!detail) return fallback;
  if (typeof detail === 'string') return detail;

  if (Array.isArray(detail)) {
    // Pydantic validation errors, and our own multi-issue lists.
    return detail.map((item) => errorText(item, '')).filter(Boolean).join('; ') || fallback;
  }

  if (typeof detail === 'object') {
    const message = detail.message || detail.msg || detail.error || '';
    const hint = detail.hint ? ` ${detail.hint}` : '';
    if (message) return `${message}${hint}`.trim();
    try { return JSON.stringify(detail); } catch (_) { return fallback; }
  }
  return String(detail);
}

function toast(message) {
  const node = $('toast');
  node.textContent = message;
  node.classList.add('show');
  setTimeout(() => node.classList.remove('show'), 2400);
}

function relative(iso) {
  if (!iso) return '';
  const then = new Date(iso).getTime();
  const seconds = Math.max(0, (Date.now() - then) / 1000);
  if (seconds < 60)    return 'just now';
  if (seconds < 3600)  return `${Math.floor(seconds / 60)}m ago`;
  if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
  if (seconds < 604800) return `${Math.floor(seconds / 86400)}d ago`;
  return new Date(iso).toLocaleDateString();
}

// ------------------------------------------------------------------ api ---

/** Which workspace this request is for.
 *
 *  Identity is no longer here: it is an httpOnly session cookie the page cannot
 *  read, sent automatically with `credentials: include`. Only the *workspace*
 *  travels as a header, and the server still checks membership before honouring
 *  it -- a header that selects a workspace is a preference, not a credential. */
function authHeaders() {
  return identity && identity.tenant ? { 'X-Tenant-Id': identity.tenant } : {};
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    credentials: 'include',
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...authHeaders(),
      ...(options.headers || {}),
    },
  });

  if (!response.ok) {
    let detail = `Request failed (${response.status})`;
    try {
      const body = await response.json();
      // `detail` is a string on FastAPI's own errors and a structured envelope
      // on ours (code/phase/message/hint). Passing the object straight into
      // Error() renders it as "[object Object]", which tells the reader
      // nothing -- so unwrap it to the message, keeping the hint when there is
      // one, because the hint is the actionable half.
      detail = errorText(body && body.detail, detail);
    } catch (_) { /* non-JSON error body; the status is all we have */ }
    if (response.status === 404) {
      detail = detail === 'Not found'
        ? 'Not found, or your account lacks access.'
        : detail;
    }
    throw new Error(detail);
  }
  return response.status === 204 ? null : response.json();
}

// -------------------------------------------------------------- sign in ---

async function startSignIn(message) {
  $('app').classList.remove('ready');
  $('signin').classList.add('on');
  if (message) showSignInError(message);

  const select = $('si-tenant');
  select.innerHTML = '<option>Loading…</option>';

  try {
    const { tenants } = await api('/api/vanna/v2/tenants');
    select.innerHTML = tenants.length
      ? tenants.map((t) => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')
      : '<option value="demo">demo</option>';
  } catch (error) {
    select.innerHTML = '<option value="demo">demo</option>';
    showSignInError(`Could not list workspaces: ${error.message}`);
  }

  const remembered = readIdentity();
  if (remembered) {
    if ([...select.options].some((o) => o.value === remembered.tenant)) {
      select.value = remembered.tenant;
    }
    $('si-email').value = remembered.email;
  }

  loadRoster(select.value);
  select.onchange = () => loadRoster(select.value);
}

/** Offer the member list as click-to-pick, when the backend exposes it.
 *  It is off by default: publishing who belongs to a workspace before anyone
 *  has authenticated is a disclosure, and only a demo wants it. */
async function loadRoster(tenantId) {
  const box = $('si-roster');
  box.innerHTML = '';
  if (!tenantId) return;
  try {
    const { users } = await api(`/api/vanna/v2/tenants/${encodeURIComponent(tenantId)}/users`);
    box.innerHTML = users.map((u) => `
      <button type="button" data-email="${esc(u.email)}">
        ${esc(u.full_name || u.email)} · ${esc(u.role)}
      </button>`).join('');
    box.querySelectorAll('button').forEach((button) => {
      button.onclick = () => { $('si-email').value = button.dataset.email; };
    });
  } catch (_) {
    // Roster disabled or unavailable -- typing an address still works.
  }
}

function showSignInError(message) {
  const node = $('si-error');
  node.textContent = message;
  node.classList.add('on');
}

function readIdentity() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (_) { return null; }
}

async function signIn(tenant, email, password) {
  // Exchange the password for a session cookie. Nothing about the identity is
  // stored by this page -- the cookie is httpOnly and the server owns it.
  const session = await api('/api/vanna/v2/auth/login', {
    method: 'POST',
    body: JSON.stringify({ email: email.trim().toLowerCase(), password }),
  });

  const memberships = session.memberships || [];

  // Signing in successfully and then finding every screen says "not a member" is
  // a worse experience than being told plainly. An account exists before it is
  // added to a workspace, so this is a normal state, not an error.
  if (!memberships.length) {
    throw new Error(
      'Signed in, but this account is not a member of any workspace yet. ' +
      'Ask an administrator to add you.'
    );
  }

  // The one asked for if they belong to it, else the first they do.
  const chosen = memberships.includes(tenant) ? tenant : memberships[0];

  identity = { tenant: chosen };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(identity));

  me = await api('/api/vanna/v2/me');
  if (session.must_change_password) {
    // A generated or admin-issued password. Say so rather than leaving a
    // temporary credential in use indefinitely.
    setTimeout(() => toast('This is a temporary password -- change it in your account.'), 800);
  }
  return me;
}

/** Switch workspace without re-authenticating -- the session already covers it. */
async function switchWorkspace(tenant) {
  identity = { tenant };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(identity));
  location.reload();
}

async function signOut() {
  try {
    await api('/api/vanna/v2/auth/logout', { method: 'POST' });
  } catch (_) { /* signing out locally matters more than the round trip */ }
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

// ------------------------------------------------------------- chrome ----

function applyTheme(next) {
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
  if (chatEl) chatEl.setAttribute('theme', next);
}

function paintChrome() {
  $('tenant-name').textContent   = me.tenant.name || me.tenant.id;
  $('tenant-source').textContent = me.tenant.data_source ? `· ${me.tenant.data_source}` : '';
  $('user-email').textContent    = me.user.email;

  const roleChip = $('user-role');
  roleChip.textContent = me.is_platform_admin ? 'platform admin' : me.user.role;
  roleChip.className   = 'chip' + (me.is_admin ? ' admin' : '');

  $('console-link').style.display = me.is_admin ? 'block' : 'none';
  $('ask-tools').style.display = me.is_admin ? 'flex' : 'none';
  // Only shown when the workspace has a semantic layer -- an empty Metrics tab
  // teaches people the feature does not work.
  api('/api/vanna/v2/cubes')
    .then(({ cubes }) => {
      if (cubes && cubes.length) $('nav-cubes').style.display = 'flex';
    })
    .catch(() => {});
  $('ds-note').textContent = me.tenant.data_source
    ? `Querying ${me.tenant.data_source}`
    : '';

  if (!me.control_plane) {
    $('ds-note').textContent =
      'No control plane configured — history, saved queries and workspaces are disabled.';
  }
}

function switchView(next) {
  view = next;
  document.querySelectorAll('nav.side button[data-view]').forEach((button) => {
    button.setAttribute('aria-current', String(button.dataset.view === next));
  });

  const ask   = $('view-ask');
  const other = $('view-other');
  const main  = $('main');

  if (next === 'ask') {
    ask.classList.add('on');
    other.style.display = 'none';
    main.classList.add('flush');
    return;
  }

  ask.classList.remove('on');
  other.style.display = 'block';
  main.classList.remove('flush');
  other.innerHTML = '<div class="empty">Loading…</div>';

  if (next === 'schema')     renderSchema();
  if (next === 'history')    renderHistory();
  if (next === 'saved')      renderSaved();
  if (next === 'dashboards') renderDashboards();
  if (next === 'cubes')      renderCubes();
}

// ----------------------------------------------------------------- ask ---

function mountChat() {
  const chat = document.createElement('vanna-chat');
  chat.setAttribute('title', 'Ask your data');
  chat.setAttribute('sse-endpoint', '/api/vanna/v2/chat_sse');
  chat.setAttribute('theme', document.documentElement.getAttribute('data-theme') || 'light');

  // Attach the listener before the element is connected: the component fires
  // vanna-ready in its first render, and its very first backend call follows
  // immediately after. Setting headers any later means that call goes out
  // unauthenticated.
  chat.addEventListener('vanna-ready', () => chat.setCustomHeaders(authHeaders()));
  chat.addEventListener('vanna-feedback', () => { historyCache = []; });
  // A new thread only gets a title once its first question is stored, so the
  // list is refreshed when an answer finishes rather than when it starts.
  chat.addEventListener('message-sent', () => {
    historyCache = [];
    setTimeout(() => { loadThreads(); loadUsage(); }, 1500);
  });

  $('chat-wrap').appendChild(chat);
  chatEl = chat;
}

function ask(question) {
  switchView('ask');
  if (chatEl && typeof chatEl.sendMessage === 'function') {
    chatEl.sendMessage(question);
  }
}

/** Show usage before the wall is hit, rather than at it. */
async function loadUsage() {
  try {
    const usage = await api('/api/vanna/v2/usage');
    if (!usage.enabled) return;
    const note = $('usage-note');
    const near = usage.used >= usage.limit * 0.8;
    note.textContent = `${usage.used} / ${usage.limit} questions today`;
    note.style.color = near ? 'var(--warn)' : '';
    note.title = 'Counted across the whole workspace, over the last 24 hours.';
  } catch (_) { /* usage is informational; never block the app on it */ }
}

async function loadStarters() {
  const box = $('starters');
  box.innerHTML = '';
  if (!me.control_plane) return;

  try {
    const { starters } = await api('/api/vanna/v2/starters');
    if (!starters.length) return;
    box.innerHTML = '<span class="lead">Try:</span>' + starters.map((s) => (
      `<button class="starter" data-q="${esc(s.question)}">${esc(s.question)}</button>`
    )).join('');
    box.querySelectorAll('.starter').forEach((button) => {
      button.onclick = () => ask(button.dataset.q);
    });
  } catch (_) {
    // Starters are a convenience; their absence is not worth an error banner.
  }
}

// -------------------------------------------------------------- schema ---

let schemaLayer = 'active';   // 'active' | 'physical'

async function renderSchema() {
  const root = $('view-other');
  try {
    schemaCache = schemaCache ||
      await api(`/api/vanna/v2/schema?layer=${encodeURIComponent(schemaLayer)}`);
  } catch (error) {
    root.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
    return;
  }

  const { tables, relationships, dialect, data_source, semantic, layer } = schemaCache;

  // With a semantic layer the agent sees models, not tables — and the physical
  // tables they are built on are deliberately hidden from it. The toggle lets a
  // human check what a model actually points at without changing what the agent
  // is shown.
  const showingPhysical = layer === 'physical';
  const noun = showingPhysical ? 'table' : (semantic ? 'model' : 'table');

  root.innerHTML = `
    <h2 class="view-title">Schema</h2>
    <p class="view-sub">
      ${tables.length} ${noun}${tables.length === 1 ? '' : 's'} in
      <span class="mono">${esc(data_source || dialect)}</span>.
      ${semantic && !showingPhysical
        ? 'This is the semantic layer — business names, computed columns and declared joins. It is exactly what the model is shown.'
        : 'This is exactly what the model is shown — if a table is missing here, it cannot be queried.'}
    </p>
    <div class="toolbar">
      <input type="search" id="schema-search" placeholder="Filter tables and columns…" />
      ${semantic ? `
        <button class="btn" id="layer-toggle">
          ${showingPhysical ? 'Show semantic layer' : 'Show physical tables'}
        </button>` : ''}
      ${me.is_admin ? '<button class="btn" id="rescan">Rescan database</button>' : ''}
    </div>
    <div class="schema-grid">
      <div class="card table-list" id="table-list"></div>
      <div id="table-detail"></div>
    </div>`;

  if (!tables.length) {
    $('table-detail').innerHTML = `
      <div class="card empty">
        Nothing has been scanned yet.
        ${me.is_admin ? 'Use “Rescan database” to build the catalog.' : 'Ask an admin to run a scan.'}
      </div>`;
  }

  let selected = tables.length ? tables[0].name : null;

  function paintList(filter) {
    const needle = (filter || '').toLowerCase();
    const shown = tables.filter((t) =>
      !needle ||
      t.name.toLowerCase().includes(needle) ||
      t.columns.some((c) => c.name.toLowerCase().includes(needle))
    );

    $('table-list').innerHTML = shown.length
      ? shown.map((t) => `
          <button data-table="${esc(t.name)}" aria-current="${t.name === selected}">
            ${esc(t.name)}<span class="count">${t.columns.length}</span>
          </button>`).join('')
      : '<div class="empty small">No match.</div>';

    $('table-list').querySelectorAll('button').forEach((button) => {
      button.onclick = () => { selected = button.dataset.table; paintList(filter); paintDetail(); };
    });
  }

  function paintDetail() {
    const table = tables.find((t) => t.name === selected);
    if (!table) return;

    const related = relationships.filter(
      (r) => r.from_table === table.name || r.to_table === table.name
    );

    $('table-detail').innerHTML = `
      <div class="card">
        <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
          <h3 style="margin:0;font-size:1rem">${esc(table.name)}</h3>
          ${table.schema ? `<span class="chip">${esc(table.schema)}</span>` : ''}
          ${table.row_count_estimate != null
            ? `<span class="muted small">~${Number(table.row_count_estimate).toLocaleString()} rows</span>`
            : ''}
          <span class="grow"></span>
          <button class="btn" data-ask="Describe the ${esc(table.name)} table and show me 10 rows.">
            Ask about this table
          </button>
        </div>
        ${table.description ? `<p class="muted small" style="margin:9px 0 0">${esc(table.description)}</p>` : ''}
      </div>

      <div class="card scroll-x">
        <table class="data">
          <thead><tr>
            <th>Column</th><th>Type</th><th>Key</th><th>Values seen</th><th>Notes</th>
          </tr></thead>
          <tbody>
            ${table.columns.map((c) => `
              <tr>
                <td class="mono">${esc(c.name)}${c.nullable ? '' : ' <span class="muted">*</span>'}</td>
                <td class="muted">${esc(c.data_type)}</td>
                <td>
                  ${c.is_primary_key ? '<span class="chip">pk</span>' : ''}
                  ${c.foreign_key
                    ? `<span class="chip" title="references ${esc(c.foreign_key.references_table)}.${esc(c.foreign_key.references_column)}">fk</span>`
                    : ''}
                </td>
                <td class="small">${
                  (c.categories && c.categories.length)
                    ? c.categories.slice(0, 8).map((v) => `<span class="chip">${esc(v)}</span>`).join(' ')
                    : (c.sample_values || []).slice(0, 3).map(esc).join(', ')
                }</td>
                <td class="muted small">${esc(c.description || '')}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>

      ${related.length ? `
        <div class="card">
          <h4 style="margin:0 0 9px;font-size:.875rem">Joins</h4>
          ${related.map((r) => `
            <div class="small mono" style="padding:3px 0">
              ${esc(r.from_table)}.${esc(r.from_column)} → ${esc(r.to_table)}.${esc(r.to_column)}
            </div>`).join('')}
        </div>` : ''}`;

    $('table-detail').querySelectorAll('[data-ask]').forEach((button) => {
      button.onclick = () => ask(button.dataset.ask);
    });
  }

  paintList('');
  if (selected) paintDetail();

  $('schema-search').oninput = (event) => paintList(event.target.value);

  if ($('layer-toggle')) {
    $('layer-toggle').onclick = () => {
      schemaLayer = showingPhysical ? 'active' : 'physical';
      schemaCache = null;
      renderSchema();
    };
  }

  if ($('rescan')) {
    $('rescan').onclick = async () => {
      const button = $('rescan');
      button.disabled = true;
      button.textContent = 'Scanning…';
      try {
        const report = await api('/api/vanna/v2/schema/rescan', { method: 'POST' });
        toast(`Scanned ${report.tables_scanned} tables, ${report.columns_profiled} columns`);
        schemaCache = null;
        renderSchema();
      } catch (error) {
        toast(error.message);
        button.disabled = false;
        button.textContent = 'Rescan database';
      }
    };
  }
}

// ------------------------------------------------------------- history ---

function statusChip(status) {
  const kind = status === 'valid' ? 'ok'
    : status === 'empty' ? 'warn'
    : 'err';
  return `<span class="chip ${kind}">${esc(status)}</span>`;
}

async function renderHistory(options = {}) {
  const root = $('view-other');
  const search = options.search ?? '';
  const mine   = options.mine ?? false;

  root.innerHTML = `
    <h2 class="view-title">History</h2>
    <p class="view-sub">Every question asked in this workspace, the SQL it produced,
      and how it went. Shared on purpose — the fastest way to answer a question is
      often to find where a colleague already did.</p>
    <div class="toolbar">
      <input type="search" id="h-search" placeholder="Search questions and SQL…" value="${esc(search)}" />
      <label class="inline"><input type="checkbox" id="h-mine" ${mine ? 'checked' : ''} /> Only mine</label>
      <button class="btn" id="h-reload">Reload</button>
    </div>
    <div id="h-body"><div class="empty">Loading…</div></div>`;

  const rerun = () => renderHistory({ search: $('h-search').value, mine: $('h-mine').checked });
  $('h-reload').onclick = rerun;
  $('h-mine').onchange = rerun;
  let timer = null;
  $('h-search').oninput = () => { clearTimeout(timer); timer = setTimeout(rerun, 300); };

  let rows;
  try {
    const params = new URLSearchParams({ limit: '100' });
    if (search) params.set('search', search);
    if (mine) params.set('mine', 'true');
    const payload = await api(`/api/vanna/v2/history?${params}`);
    rows = payload.history;
    if (!payload.control_plane) {
      $('h-body').innerHTML = '<div class="empty">History needs a control-plane database.</div>';
      return;
    }
  } catch (error) {
    $('h-body').innerHTML = `<div class="empty">${esc(error.message)}</div>`;
    return;
  }

  historyCache = rows;

  if (!rows.length) {
    $('h-body').innerHTML = '<div class="empty">Nothing here yet. Ask a question and it will show up.</div>';
    return;
  }

  $('h-body').innerHTML = rows.map((row, index) => `
    <div class="card">
      <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
        <strong style="flex:1;min-width:200px">${esc(row.question || '(no question recorded)')}</strong>
        ${statusChip(row.status)}
        ${row.feedback === 'positive' ? '<span class="chip ok">liked</span>' : ''}
        ${row.feedback === 'negative' ? '<span class="chip err">disliked</span>' : ''}
      </div>
      <div class="muted small" style="margin:5px 0 9px">
        ${esc(row.user_id)} · ${esc(relative(row.created_at))}
        ${row.row_count != null ? ` · ${row.row_count} rows` : ''}
        ${row.execution_ms != null ? ` · ${Math.round(row.execution_ms)} ms` : ''}
      </div>
      ${row.sql ? `<pre class="sql">${esc(row.sql)}</pre>` : ''}
      ${row.error ? `<div class="small" style="color:var(--bad);margin-top:8px">${esc(row.error)}</div>` : ''}
      <div class="toolbar" style="margin:12px 0 0">
        <button class="btn" data-act="ask"  data-i="${index}">Ask again</button>
        <button class="btn" data-act="run"  data-i="${index}">Run SQL</button>
        <button class="btn" data-act="save" data-i="${index}">Save</button>
        <button class="btn" data-act="copy" data-i="${index}">Copy SQL</button>
      </div>
    </div>`).join('');

  $('h-body').querySelectorAll('[data-act]').forEach((button) => {
    const row = rows[Number(button.dataset.i)];
    button.onclick = () => {
      if (button.dataset.act === 'ask')  return ask(row.question);
      if (button.dataset.act === 'run')  return runSql(row.sql, { question: row.question, title: 'Run SQL' });
      if (button.dataset.act === 'save') return openSaveSheet(row.question, row.sql);
      navigator.clipboard.writeText(row.sql || '').then(() => toast('SQL copied'));
    };
  });
}

// --------------------------------------------------------------- saved ---

async function renderSaved() {
  const root = $('view-other');
  let saved;
  try {
    ({ saved } = await api('/api/vanna/v2/saved-queries'));
  } catch (error) {
    root.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
    return;
  }

  root.innerHTML = `
    <h2 class="view-title">Saved queries</h2>
    <p class="view-sub">Shared with everyone in this workspace. Run them as they are,
      or use one as the starting point for a new question.</p>
    <div class="toolbar">
      <button class="btn primary" id="new-saved">New saved query</button>
    </div>
    <div id="saved-body">
      ${saved.length ? saved.map((item, index) => `
        <div class="card">
          <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
            <strong style="flex:1;min-width:180px">${esc(item.title)}</strong>
            <span class="muted small">${esc(item.created_by)} · ${esc(relative(item.created_at))}</span>
          </div>
          ${item.question ? `<p class="muted small" style="margin:6px 0 9px">${esc(item.question)}</p>` : ''}
          <pre class="sql">${esc(item.sql)}</pre>
          <div class="toolbar" style="margin:12px 0 0">
            <button class="btn primary" data-act="run" data-i="${index}">Run</button>
            <button class="btn" data-act="ask"  data-i="${index}">Ask about it</button>
            <button class="btn" data-act="copy" data-i="${index}">Copy</button>
            <button class="btn danger" data-act="del" data-i="${index}">Delete</button>
          </div>
        </div>`).join('')
      : '<div class="empty">Nothing saved yet. Save a query from History, or add one here.</div>'}
    </div>`;

  $('new-saved').onclick = () => openSaveSheet('', '');

  $('saved-body').querySelectorAll('[data-act]').forEach((button) => {
    const item = saved[Number(button.dataset.i)];
    button.onclick = async () => {
      const action = button.dataset.act;
      if (action === 'run') return runSql(item.sql, { question: item.question, title: item.title });
      if (action === 'ask') return ask(item.question || `Explain what this query returns: ${item.sql}`);
      if (action === 'copy') {
        navigator.clipboard.writeText(item.sql).then(() => toast('SQL copied'));
        return;
      }
      if (!confirm(`Delete “${item.title}”?`)) return;
      try {
        await api(`/api/vanna/v2/saved-queries/${encodeURIComponent(item.id)}`, { method: 'DELETE' });
        toast('Deleted');
        renderSaved();
      } catch (error) { toast(error.message); }
    };
  });
}

function openSaveSheet(question, sql) {
  openSheet(`
    <h3>Save a query</h3>
    <label for="sv-title">Title</label>
    <input id="sv-title" placeholder="Monthly revenue by region" />
    <label for="sv-question">Question it answers (optional)</label>
    <input id="sv-question" value="${esc(question || '')}" />
    <label for="sv-sql">SQL</label>
    <textarea id="sv-sql">${esc(sql || '')}</textarea>
    <div class="actions">
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" id="sv-save">Save</button>
    </div>`);

  const titleField = $('sv-title');
  titleField.value = (question || '').slice(0, 60);
  titleField.focus();

  $('sv-save').onclick = async () => {
    const title = $('sv-title').value.trim();
    const body = {
      title,
      question: $('sv-question').value.trim(),
      sql: $('sv-sql').value.trim(),
    };
    if (!title || !body.sql) return toast('A title and SQL are required');
    try {
      await api('/api/vanna/v2/saved-queries', { method: 'POST', body: JSON.stringify(body) });
      closeSheet();
      toast('Saved');
      if (view === 'saved') renderSaved();
    } catch (error) { toast(error.message); }
  };
}

// ------------------------------------------------------------- preview ---

/** Show what the model is actually told, and what the budget cut.
 *
 *  The reason this is worth a button: when an answer is wrong, the usual cause
 *  is that the right example or rule never reached the prompt, and there is
 *  otherwise no way to see that from the outside. */
async function previewPrompt() {
  const question = prompt('Preview the context assembled for which question?');
  if (!question || !question.trim()) return;

  openSheet('<h3>Assembling…</h3><div class="empty">Running retrieval.</div>');

  let payload;
  try {
    payload = await api(
      `/api/vanna/v2/prompt-preview?question=${encodeURIComponent(question.trim())}`
    );
  } catch (error) {
    openSheet(`<h3>Preview failed</h3>
      <div class="small" style="color:var(--bad)">${esc(error.message)}</div>
      <div class="actions"><button class="btn" data-close>Close</button></div>`);
    return;
  }

  const over = payload.budget && payload.tokens_used > payload.budget * 0.9;
  openSheet(`
    <h3>Context for &ldquo;${esc(payload.question)}&rdquo;</h3>
    <div class="small ${over ? '' : 'muted'}" style="${over ? 'color:var(--warn)' : ''}">
      ${payload.tokens_used} / ${payload.budget} tokens
    </div>
    ${payload.sections.length ? `
      <div class="card scroll-x" style="margin-top:12px">
        <table class="data">
          <thead><tr><th>Section</th><th>Tokens</th><th>Dropped</th></tr></thead>
          <tbody>${payload.sections.map((s) => `
            <tr>
              <td>${esc(s.name)}${s.truncated ? ' <span class="chip warn">truncated</span>' : ''}</td>
              <td>${s.tokens}</td>
              <td>${s.dropped_items
                ? `<span style="color:var(--warn)">${s.dropped_items}</span>` : '0'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>` : `<div class="empty">${esc(payload.note || 'Nothing retrieved.')}</div>`}
    ${payload.text ? `
      <div class="muted small" style="margin:14px 0 6px">Assembled context</div>
      <pre class="sql" style="max-height:38vh;overflow:auto">${esc(payload.text)}</pre>` : ''}
    <div class="actions"><button class="btn" data-close>Close</button></div>`);
}

// --------------------------------------------------------------- cubes ---
//
// Pick measures and dimensions rather than writing an aggregate. The grain was
// decided when the cube was defined, so a selection here cannot double-count
// across a one-to-many join the way a hand-written SUM can.

let cubeCache = null;

async function renderCubes() {
  const root = $('view-other');
  try {
    cubeCache = cubeCache || (await api('/api/vanna/v2/cubes')).cubes;
  } catch (error) {
    root.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
    return;
  }

  if (!cubeCache.length) {
    root.innerHTML = `<div class="empty">No metrics defined. Add a cube under
      <span class="mono">cubes/</span> in the project and rebuild.</div>`;
    return;
  }

  let selected = cubeCache[0];

  root.innerHTML = `
    <h2 class="view-title">Metrics</h2>
    <p class="view-sub">Pick what to measure and how to break it down. The
      aggregation is defined once, in the project, so these totals cannot be
      computed at the wrong grain.</p>
    <div class="toolbar">
      <select id="cube-pick" style="max-width:280px">
        ${cubeCache.map((c) => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('')}
      </select>
      <button class="btn primary" id="cube-run">Run</button>
    </div>
    <div class="card" id="cube-controls"></div>
    <div id="cube-result"></div>`;

  function paintControls() {
    $('cube-controls').innerHTML = `
      <label class="inline" style="display:block;margin-bottom:6px">Measures</label>
      <div class="roster" id="cube-measures">
        ${selected.measures.map((m, i) => `
          <label class="inline" title="${esc(m.expression)}">
            <input type="checkbox" data-measure="${esc(m.name)}" ${i === 0 ? 'checked' : ''} />
            ${esc(m.name)}
          </label>`).join('')}
      </div>
      ${selected.dimensions.length ? `
        <label class="inline" style="display:block;margin:12px 0 6px">Break down by</label>
        <div class="roster">
          ${selected.dimensions.map((d) => `
            <label class="inline">
              <input type="checkbox" data-dimension="${esc(d)}" /> ${esc(d)}
            </label>`).join('')}
        </div>` : ''}
      ${selected.time_dimensions.length ? `
        <label class="inline" style="display:block;margin:12px 0 6px">Over time</label>
        <select id="cube-time" style="max-width:200px;display:inline-block">
          <option value="">(none)</option>
          ${selected.time_dimensions.map((d) => `<option value="${esc(d)}">${esc(d)}</option>`).join('')}
        </select>
        <select id="cube-grain" style="max-width:160px;display:inline-block;margin-left:8px">
          ${['day','week','month','quarter','year'].map((g) =>
            `<option value="${g}" ${g === 'month' ? 'selected' : ''}>${g}</option>`).join('')}
        </select>` : ''}`;
  }

  paintControls();

  $('cube-pick').onchange = () => {
    selected = cubeCache.find((c) => c.name === $('cube-pick').value);
    paintControls();
    $('cube-result').innerHTML = '';
  };

  $('cube-run').onclick = async () => {
    const measures = [...document.querySelectorAll('[data-measure]:checked')]
      .map((el) => el.dataset.measure);
    const dimensions = [...document.querySelectorAll('[data-dimension]:checked')]
      .map((el) => el.dataset.dimension);
    const time = $('cube-time') ? $('cube-time').value : '';

    if (!measures.length) return toast('Pick at least one measure');

    $('cube-result').innerHTML = '<div class="empty">Running…</div>';
    let payload;
    try {
      payload = await api(`/api/vanna/v2/cubes/${encodeURIComponent(selected.name)}/query`, {
        method: 'POST',
        body: JSON.stringify({
          measures, dimensions,
          time_dimension: time || null,
          granularity: time ? $('cube-grain').value : null,
        }),
      });
    } catch (error) {
      $('cube-result').innerHTML = `<div class="empty">${esc(error.message)}</div>`;
      return;
    }

    $('cube-result').innerHTML = `
      ${(payload.warnings || []).map((w) =>
        `<div class="card small" style="color:var(--warn)">${esc(w)}</div>`).join('')}
      <div class="card"><div id="cube-chart" style="height:300px"></div></div>
      <div class="card scroll-x">
        <table class="data">
          <thead><tr>${payload.columns.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead>
          <tbody>${payload.rows.map((row) =>
            `<tr>${row.map((cell) => `<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>
        <div class="muted small" style="margin-top:8px">${payload.row_count} rows</div>
      </div>`;

    // The first column is whatever we grouped by; the rest are the measures.
    const grouped = dimensions.length || time;
    mountChart($('cube-chart'),
      { chart: { type: time ? 'line' : 'bar',
                 x: grouped ? payload.columns[0] : null,
                 y: payload.columns.slice(grouped ? 1 : 0) } },
      payload);
  };
}

// ------------------------------------------------------------- threads ---
//
// A conversation is one person's working notes. The backend scopes them by
// (tenant, user) and the agent already persists every turn, so this only has to
// list, switch and rename.

let threads = [];
let currentThread = null;

async function loadThreads() {
  const box = $('threads');
  try {
    const payload = await api('/api/vanna/v2/conversations');
    if (!payload.persisted) {
      // Without a control plane, threads would silently vanish on restart.
      // Hiding the list is more honest than offering one that forgets.
      box.style.display = 'none';
      return;
    }
    threads = payload.conversations;
  } catch (_) {
    box.style.display = 'none';
    return;
  }
  paintThreads();
}

function paintThreads() {
  $('thread-list').innerHTML = threads.map((thread) => `
    <div class="thread" data-id="${esc(thread.id)}"
         aria-current="${thread.id === currentThread}">
      <span class="label" title="${esc(thread.title)}">${esc(thread.title || 'Untitled')}</span>
      <button class="menu" data-rename="${esc(thread.id)}" title="Rename">&#9998;</button>
      <button class="menu" data-del="${esc(thread.id)}" title="Delete">&times;</button>
    </div>`).join('');

  $('thread-list').querySelectorAll('.thread').forEach((row) => {
    row.onclick = (event) => {
      if (event.target.closest('.menu')) return;
      openThread(row.dataset.id);
    };
  });
  $('thread-list').querySelectorAll('[data-rename]').forEach((button) => {
    button.onclick = () => renameThread(button.dataset.rename);
  });
  $('thread-list').querySelectorAll('[data-del]').forEach((button) => {
    button.onclick = () => deleteThread(button.dataset.del);
  });
}

async function openThread(id) {
  let payload;
  try {
    payload = await api(`/api/vanna/v2/conversations/${encodeURIComponent(id)}`);
  } catch (error) { return toast(error.message); }

  currentThread = id;
  switchView('ask');
  // Without this the widget keeps posting to the previous conversation and the
  // two transcripts silently merge server-side.
  chatEl.loadConversation(id, payload.messages);
  paintThreads();
}

function newThread() {
  currentThread = chatEl.newConversation();
  switchView('ask');
  paintThreads();
}

async function renameThread(id) {
  const thread = threads.find((t) => t.id === id);
  const title = prompt('Rename this conversation', thread ? thread.title : '');
  if (title === null || !title.trim()) return;
  try {
    await api(`/api/vanna/v2/conversations/${encodeURIComponent(id)}`, {
      method: 'PATCH', body: JSON.stringify({ title: title.trim() }),
    });
    await loadThreads();
  } catch (error) { toast(error.message); }
}

async function deleteThread(id) {
  if (!confirm('Delete this conversation and its messages?')) return;
  try {
    await api(`/api/vanna/v2/conversations/${encodeURIComponent(id)}`, { method: 'DELETE' });
  } catch (error) { return toast(error.message); }
  if (currentThread === id) newThread();
  await loadThreads();
}

// ---------------------------------------------------------- dashboards ---

async function renderDashboards() {
  const root = $('view-other');
  let dashboards;
  try {
    ({ dashboards } = await api('/api/vanna/v2/dashboards'));
  } catch (error) {
    root.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
    return;
  }

  root.innerHTML = `
    <h2 class="view-title">Dashboards</h2>
    <p class="view-sub">Tiles are executed with <em>your</em> permissions when you
      open one — two people can open the same dashboard and see different numbers.</p>
    <div id="dash-body">
      ${dashboards.length ? dashboards.map((d, index) => `
        <div class="card">
          <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
            <strong style="flex:1;min-width:180px">${esc(d.title)}</strong>
            <span class="muted small">${esc(d.created_by)} · ${esc(relative(d.updated_at))}</span>
          </div>
          <div class="toolbar" style="margin:12px 0 0">
            <button class="btn primary" data-open="${index}">Open</button>
            <button class="btn danger" data-del="${index}">Delete</button>
          </div>
        </div>`).join('')
      : `<div class="empty">No dashboards yet. Ask in chat: “build me a dashboard
           of revenue by region”.</div>`}
    </div>`;

  root.querySelectorAll('[data-open]').forEach((button) => {
    button.onclick = () => openDashboard(dashboards[Number(button.dataset.open)]);
  });
  root.querySelectorAll('[data-del]').forEach((button) => {
    const dashboard = dashboards[Number(button.dataset.del)];
    button.onclick = async () => {
      if (!confirm(`Delete “${dashboard.title}”?`)) return;
      try {
        await api(`/api/vanna/v2/dashboards/${encodeURIComponent(dashboard.id)}`,
                  { method: 'DELETE' });
        renderDashboards();
      } catch (error) { toast(error.message); }
    };
  });
}

async function openDashboard(summary) {
  openSheet(`<h3>${esc(summary.title)}</h3><div class="empty">Running tiles…</div>`);

  let payload;
  try {
    payload = await api(`/api/vanna/v2/dashboards/${encodeURIComponent(summary.id)}/data`);
  } catch (error) {
    openSheet(`<h3>${esc(summary.title)}</h3>
      <div class="small" style="color:var(--bad)">${esc(error.message)}</div>
      <div class="actions"><button class="btn" data-close>Close</button></div>`);
    return;
  }

  const tiles = (summary.document?.tiles) || [];
  const byId = Object.fromEntries(payload.results.map((r) => [r.tile_id, r]));

  const body = tiles.map((tile) => {
    const result = byId[tile.id] || {};
    if (tile.kind === 'text') {
      return `<div class="card"><strong>${esc(tile.title || '')}</strong>
                <p class="muted small">${esc(tile.text || '')}</p></div>`;
    }
    if (result.error) {
      // Per tile, so one broken query leaves the rest of the page readable.
      return `<div class="card"><strong>${esc(tile.title || 'Untitled')}</strong>
                <div class="small" style="color:var(--bad);margin-top:6px">
                  ${esc(result.error)}</div></div>`;
    }
    const columns = result.columns || [];
    const rows = result.rows || [];
    const caveats = (result.warnings || []).map((w) =>
      `<div class="small" style="color:var(--warn);margin-top:6px">${esc(w)}</div>`
    ).join('');

    if (tile.kind === 'metric') {
      // One number, large. Read far more often than any chart, so it gets its
      // own rendering rather than a one-row table.
      const value = rows.length && rows[0].length ? rows[0][rows[0].length - 1] : '--';
      return `
        <div class="card">
          <div class="muted small">${esc(tile.title || '')}</div>
          <div style="font-size:2.1rem;font-weight:650;margin-top:4px">${esc(value)}</div>
          ${caveats}
        </div>`;
    }

    if (tile.kind === 'chart') {
      // Rendered after insertion: <plotly-chart> takes its data as properties,
      // which cannot be expressed in an HTML string.
      return `
        <div class="card">
          <strong>${esc(tile.title || 'Untitled')}</strong>
          ${caveats}
          <div class="tile-chart" data-tile="${esc(tile.id)}" style="height:300px;margin-top:10px"></div>
        </div>`;
    }

    return `
      <div class="card">
        <strong>${esc(tile.title || 'Untitled')}</strong>
        ${caveats}
        <div class="scroll-x" style="margin-top:10px">
          <table class="data">
            <thead><tr>${columns.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead>
            <tbody>${rows.slice(0, 20).map((row) =>
              `<tr>${row.map((cell) => `<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div class="muted small" style="margin-top:8px">${result.row_count || 0} rows${
          result.truncated ? ' (capped)' : ''}</div>
      </div>`;
  }).join('');

  openSheet(`<h3>${esc(summary.title)}</h3>${body || '<div class="empty">No tiles.</div>'}
    <div class="actions"><button class="btn" data-close>Close</button></div>`);

  // Charts are mounted after the sheet exists, because <plotly-chart> receives
  // its series as element properties rather than attributes.
  tiles.filter((tile) => tile.kind === 'chart').forEach((tile) => {
    const mount = $('sheet').querySelector(`.tile-chart[data-tile="${CSS.escape(tile.id)}"]`);
    if (mount) mountChart(mount, tile, byId[tile.id] || {});
  });
}

/** Turn a tile's rows into a Plotly chart, honouring its ChartSpec.
 *
 *  The spec is what the agent chose; the fallbacks below only apply where it
 *  said nothing, which mirrors how the backend treats it. */
function mountChart(mount, tile, result) {
  const columns = result.columns || [];
  const rows = result.rows || [];
  if (!columns.length || !rows.length) {
    mount.innerHTML = '<div class="empty small">No data.</div>';
    return;
  }

  const spec = tile.chart || {};
  const column = (name) => columns.indexOf(name);

  const xName = spec.x && column(spec.x) >= 0 ? spec.x : columns[0];
  const yNames = (spec.y || []).filter((name) => column(name) >= 0);
  const series = yNames.length ? yNames : columns.filter((c) => c !== xName);

  const x = rows.map((row) => row[column(xName)]);
  const type = spec.type || 'bar';

  const traces = series.map((name) => {
    const y = rows.map((row) => row[column(name)]);
    if (type === 'pie') return { type: 'pie', labels: x, values: y, name };
    if (type === 'scatter') return { type: 'scatter', mode: 'markers', x, y, name };
    if (type === 'line' || type === 'area') {
      return { type: 'scatter', mode: 'lines+markers', x, y, name,
               fill: type === 'area' ? 'tozeroy' : undefined };
    }
    return { type: 'bar', x, y, name };
  });

  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const element = document.createElement('plotly-chart');
  element.data = traces;
  element.layout = {
    margin: { t: 10, r: 10, b: 40, l: 50 },
    barmode: spec.stacked ? 'stack' : 'group',
    showlegend: series.length > 1,
    xaxis: { title: spec.x_label || xName },
    yaxis: { title: spec.y_label || (series.length === 1 ? series[0] : '') },
    paper_bgcolor: 'rgba(0,0,0,0)',
    plot_bgcolor: 'rgba(0,0,0,0)',
    font: { color: dark ? '#e5e7eb' : '#0f172a' },
  };
  element.style.height = '100%';
  mount.innerHTML = '';
  mount.appendChild(element);
}

// ----------------------------------------------------------- run result ---

async function runSql(sql, options = {}) {
  if (!sql) return toast('There is no SQL on this entry');

  // The statement stays editable while the result is on screen. Adjusting a
  // LIMIT or a filter and re-running is the single most common thing anyone
  // does with generated SQL, and closing the sheet to do it loses the result
  // you were comparing against.
  const state = { sql, result: null, error: null, running: false };

  function render() {
    const isWrite = !/^\s*(select|with)/i.test(state.sql);
    openSheet(`
      <h3>${esc(options.title || 'Query')}</h3>
      <textarea id="sql-edit" class="sql-editor" spellcheck="false">${esc(state.sql)}</textarea>
      ${isWrite ? `
        <div class="small" style="color:var(--warn);margin-top:8px">
          This is not a SELECT. It will be rejected unless writes are enabled
          for this workspace and you are an admin.
        </div>` : ''}
      <div class="toolbar" style="margin:10px 0 0">
        <button class="btn primary" id="sql-run" ${state.running ? 'disabled' : ''}>
          ${state.running ? 'Running…' : 'Run'}
        </button>
        <button class="btn" id="sql-save">Save as query</button>
        <span class="muted small">Ctrl+Enter to run</span>
      </div>
      ${state.error ? `
        <div class="card small" style="color:var(--bad);margin-top:12px">${esc(state.error)}</div>` : ''}
      ${state.result ? `
        <div class="muted small" style="margin:12px 0 6px">
          ${state.result.row_count} row${state.result.row_count === 1 ? '' : 's'}${
            state.result.truncated ? ' (capped)' : ''}
        </div>
        <div class="scroll-x card" style="max-height:44vh;overflow:auto">
          <table class="data">
            <thead><tr>${state.result.columns.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead>
            <tbody>${state.result.rows.map((row) =>
              `<tr>${row.map((cell) => `<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}
            </tbody>
          </table>
        </div>` : ''}
      <div class="actions">
        ${state.result ? '<button class="btn" id="dl-csv">Download CSV</button>' : ''}
        <button class="btn" data-close>Close</button>
      </div>`);

    const editor = $('sql-edit');
    editor.oninput = () => { state.sql = editor.value; };
    editor.onkeydown = (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
        event.preventDefault();
        execute();
      }
    };

    $('sql-run').onclick = execute;
    $('sql-save').onclick = () => openSaveSheet(options.question || '', state.sql);
    if ($('dl-csv')) $('dl-csv').onclick = () => downloadCsv(state.result);
  }

  async function execute() {
    if (!state.sql.trim()) return toast('Nothing to run');
    state.running = true;
    state.error = null;
    render();
    try {
      // Through the same endpoint, so the policy and the semantic compiler
      // apply. A statement someone typed by hand is not more trusted than one
      // the model wrote.
      state.result = await api('/api/vanna/v2/run-sql', {
        method: 'POST',
        body: JSON.stringify({ sql: state.sql, limit: 200 }),
      });
    } catch (error) {
      state.result = null;
      state.error = error.message;
    }
    state.running = false;
    render();
  }

  render();
  execute();
}

function downloadCsv(result) {
  const quote = (value) => {
    const text = value == null ? '' : String(value);
    // Prefix anything a spreadsheet would evaluate. A cell that starts with
    // '=' or '+' is a formula in Excel, and this data came from a database
    // someone else may control.
    const guarded = /^[=+\-@\t\r]/.test(text) ? `'${text}` : text;
    return `"${guarded.replace(/"/g, '""')}"`;
  };

  const csv = [result.columns.map(quote).join(',')]
    .concat(result.rows.map((row) => row.map(quote).join(',')))
    .join('\n');

  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = `vanna-${Date.now()}.csv`;
  link.click();
  URL.revokeObjectURL(url);
}

// -------------------------------------------------------------- sheets ---

function openSheet(html) {
  $('sheet').innerHTML = html;
  $('overlay').classList.add('on');
  $('sheet').querySelectorAll('[data-close]').forEach((button) => {
    button.onclick = closeSheet;
  });
}

function closeSheet() {
  $('overlay').classList.remove('on');
  $('sheet').innerHTML = '';
}

// ---------------------------------------------------- workspace switch ---

function openWorkspaceSheet() {
  const others = (me.memberships || []).filter((t) => t !== me.tenant.id);
  openSheet(`
    <h3>Workspace</h3>
    <p class="muted small">You are in <strong>${esc(me.tenant.name)}</strong>${
      me.tenant.data_source ? `, querying <span class="mono">${esc(me.tenant.data_source)}</span>` : ''
    }.</p>
    ${others.length ? `
      <label>Switch to</label>
      <div class="roster">
        ${others.map((t) => `<button data-tenant="${esc(t)}">${esc(t)}</button>`).join('')}
      </div>`
    : '<p class="muted small">This is the only workspace you belong to.</p>'}
    <div class="actions">
      <button class="btn danger" id="ws-signout">Sign out</button>
      <button class="btn" data-close>Close</button>
    </div>`);

  $('sheet').querySelectorAll('[data-tenant]').forEach((button) => {
    button.onclick = async () => {
      // No re-authentication: the session already covers every workspace this
      // account belongs to.
      switchWorkspace(button.dataset.tenant);
    };
  });
  $('ws-signout').onclick = signOut;
}

// ----------------------------------------------------------------- boot ---

async function boot() {
  applyTheme(localStorage.getItem(THEME_KEY) || 'light');

  $('theme-btn').onclick = () => {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  };
  $('new-chat').onclick = newThread;
  $('preview-prompt').onclick = previewPrompt;
  $('tenant-pill').onclick = openWorkspaceSheet;
  $('user-pill').onclick   = openWorkspaceSheet;
  $('overlay').onclick     = (event) => { if (event.target === $('overlay')) closeSheet(); };
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeSheet();
  });

  document.querySelectorAll('nav.side button[data-view]').forEach((button) => {
    button.onclick = () => switchView(button.dataset.view);
  });

  $('si-go').onclick = async () => {
    const tenant   = $('si-tenant').value;
    const email    = $('si-email').value.trim();
    const password = $('si-password').value;
    if (!email) return showSignInError('Enter your email address.');
    if (!password) return showSignInError('Enter your password.');
    try {
      await signIn(tenant, email, password);
      enterApp();
    } catch (error) {
      identity = null;
      showSignInError(error.message);
    }
  };
  for (const field of ['si-email', 'si-password']) {
    $(field).onkeydown = (event) => { if (event.key === 'Enter') $('si-go').click(); };
  }

  // The stored value is only the last workspace. Whether there is a session at
  // all is the server's answer, not something this page can know.
  identity = readIdentity() || {};
  try {
    me = await api('/api/vanna/v2/me');
    enterApp();
  } catch (error) {
    identity = null;
    // A 401/403 on boot is the normal signed-out case, not an error worth
    // shouting about; anything else is worth showing.
    startSignIn(/sign in|not valid|disabled/i.test(error.message) ? '' : error.message);
  }
}

function enterApp() {
  $('signin').classList.remove('on');
  $('app').classList.add('ready');
  paintChrome();
  if (!chatEl) mountChat();
  loadStarters();
  loadThreads();
  loadUsage();
  switchView('ask');
}

boot();
</script>
