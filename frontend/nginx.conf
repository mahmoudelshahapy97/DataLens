# Serves the UI and proxies the API, so the browser sees one origin.
#
# Same-origin is the point. It removes CORS entirely, lets cookies reach the API
# without SameSite trouble, and means the frontend can call /api/... with no
# configured base URL.

# WebSocket upgrade. The previous config set `Connection ''` in the /api/ block --
# correct for SSE keep-alives and fatal for WebSockets, which need
# `Upgrade: websocket` and `Connection: upgrade` forwarded verbatim. The result was
# that /api/vanna/v2/chat_websocket could never complete a handshake through nginx;
# only the SSE transport worked, and nobody noticed because the frontend prefers SSE.
#
# This map yields "upgrade" when the client asked for one and "" otherwise, so both
# transports get the header they need from one location block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# The backend, by compose service name. `backend`, not `api`: the service is named
# after the directory it is built from, so a reader who sees `backend/` in the tree
# knows which container serves it.
upstream vanna_api {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version. Free, and removes one line from a scanner's
    # report.
    server_tokens off;

    # ------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------
    #
    # Content-Security-Policy is the control that matters here: the pages render
    # user-supplied and LLM-supplied text, and a personal LLM key lives in
    # localStorage. `esc()` at every interpolation is the first line of defence and
    # CSP is what remains standing if one call site is ever missed.
    #
    # Note the absence of 'unsafe-inline' in script-src. That is only possible
    # because the CSS and JavaScript were moved out of the HTML into files under
    # /assets/ -- an inline <script> and a real CSP cannot both exist, and of the two
    # the CSP is worth more.
    #
    # style-src keeps 'unsafe-inline' for now: Plotly writes inline styles onto the
    # nodes it creates, and there is no nonce path through it. Inline *style* is a
    # far weaker vector than inline script.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    # HSTS. Harmless over plain HTTP (browsers ignore it on an insecure origin) and
    # essential the moment TLS is terminated in front of this. Two years, with
    # subdomains, and preload-eligible.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    add_header X-Content-Type-Options "nosniff" always;
    # frame-ancestors in the CSP supersedes this for modern browsers; kept for old
    # ones, and consistent with it.
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Nothing here needs a camera, a microphone or a location.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ------------------------------------------------------------------
    # Static assets
    # ------------------------------------------------------------------

    # Everything under /assets/ is cached and revalidated.
    #
    # This was `expires 1y; immutable` for the whole directory, with a comment
    # claiming the filenames were hashed. They are not: app.js, app.css, console.js,
    # console.css, shared/core.js and vanna-components.js keep the same name across
    # every deploy. `immutable` tells the browser never to revalidate, so one bad
    # deploy is permanent for everybody who loaded it -- no reload clears it, because
    # the browser never asks again. That is not hypothetical: a broken app.js
    # shipped, was cached, and the page stayed blank after the fix was deployed. An unchanged file answers
    # 304 with no body, so this costs one small conditional request per asset per
    # page load -- and removes an entire class of "the user is stuck on a broken
    # version" bug that no reload can clear.
    #
    # There was an attempt here to keep `immutable` for genuinely hashed filenames,
    # detected by regex. It matched `vanna-components.js` -- `-components` is ten
    # word characters -- and pinned the main bundle for a year, which is precisely
    # the bug being fixed. Telling a content hash from a hyphenated word by pattern
    # is not something to be clever about at 3am.
    #
    # The durable fix is to hash these names at *build* time, at which point the
    # build knows which files are hashed and this can say so without guessing. Until
    # then, one conditional request beats a year of being wrong.
    #
    # `^~`, not a plain prefix: nginx evaluates regex locations *before* prefix ones,
    # so the generic asset block further down was silently winning every /assets/
    # request. That is why these files were served with no Cache-Control at all and
    # browsers fell back to heuristic caching -- which is what left a blank page
    # after the fixed bundle had already been deployed.
    #
    # RESOLVED. The build hashes every filename now -- `assets/[name]-[hash].js`
    # and `[name]-[hash][extname]` -- so a changed file is a changed URL and
    # `immutable` cannot pin anybody to a broken deploy. That was the condition
    # the note above set, and it is met, so the conditional request per asset per
    # page load goes away.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;

        # nginx 1.27's mime.types has no entry for `.mjs`, so these were served as
        # `application/octet-stream` -- and a browser refuses to execute an ES module
        # under a non-JavaScript type. Vite names its dynamic chunks `.mjs`, and the
        # one that mattered was `plotly.min-<hash>.mjs`: every chart in the product
        # failed with "Failed to fetch dynamically imported module" while the request
        # was a perfectly healthy 200 carrying 7MB of correct JavaScript.
        #
        # That is the worst shape a delivery bug takes. The network tab is green, the
        # bytes are right, the server is right, and nothing testable server-side can
        # see it -- only the Content-Type is wrong, and only the browser cares.
        #
        # Scoped to a nested location rather than declared on the server, because a
        # `types` block *replaces* the inherited map instead of extending it: at
        # server level this one line would have served every stylesheet and every
        # font as octet-stream too. Here it governs nothing but `.mjs`.
        location ~* \.mjs$ {
            types { application/javascript mjs; }
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            try_files $uri =404;
        }
    }

    # The /locales/ block that used to be here is gone with the files it guarded.
    # The dictionaries are modules inside the bundle now, not JSON fetched at
    # runtime -- so the failure it existed to prevent (a missing dictionary
    # answered with the HTML shell at status 200, the interface then rendering
    # raw keys like "nav.account") is no longer reachable. See src/i18n/en.ts.

    # The console moved into the application.
    #
    # /admin/ used to serve a *second* application -- its own HTML, its own
    # console.js, its own dictionaries -- against the same API. Now that every
    # console screen is a route in the React app, leaving it served meant two
    # consoles live at once, both writing the same grants and instructions, and
    # a bookmark landing on whichever one it was saved from.
    #
    # `absolute_redirect off` is the load-bearing half. nginx builds a 301
    # Location from server_name and the *listening* port, which is 80 inside the
    # container -- and the container publishes 3000. So `return 301 /console/...`
    # emitted `http://127.0.0.1/console/...` with the port dropped, and a browser
    # on :3000 followed it to :80 and got nothing. Relative Location, no port to
    # get wrong.
    absolute_redirect off;

    location = /admin {
        return 301 /console/permissions;
    }

    location ^~ /admin/ {
        return 301 /console/permissions;
    }

    # Anything else that looks like a file gets a 404 when it is missing, rather
    # than falling through to the SPA shell below. /assets/, /locales/ and /admin/
    # are handled above and use `^~` so they are not reached by this.
    #
    # The catch-all `try_files ... /index.html` is right for routes and wrong for
    # assets: a request for /favicon.svg was answered with the whole HTML page, at
    # status 200, with `Content-Type: text/html`. The browser cannot use it, nothing
    # logs an error, and the tab shows a blank icon -- the same shape of bug the
    # /locales/ block above already exists to prevent.
    # `mjs` is in the list for the same reason as the rest: a missing module must
    # 404 rather than be answered with the HTML shell at status 200. Chunks live
    # under /assets/, which is handled above, so this is about honesty for strays.
    location ~* \.(?:ico|png|svg|jpg|jpeg|gif|webp|css|js|mjs|map|woff2?|ttf|txt|json)$ {
        try_files $uri =404;
        # Same reasoning as /assets/: a stable filename must stay revalidatable.
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # HTML is never cached. index.html keeps the same URL forever -- so without
        # this a
        # browser serves yesterday's page after a deploy, and every fix looks like it
        # did not ship. That is a genuinely expensive class of confusion: the user
        # reports a bug that was fixed hours ago.
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ------------------------------------------------------------------
    # API
    # ------------------------------------------------------------------

    location /api/ {
        proxy_pass http://vanna_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- WebSocket and Server-Sent Events -------------------------
        #
        # Streaming is the whole user experience here, and nginx defaults actively
        # break it: proxy_buffering holds the response until a buffer fills, so
        # tokens arrive in bursts or not at all.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache     off;
        chunked_transfer_encoding off;

        # A long analytical query can legitimately run for minutes. The default 60s
        # would sever the connection mid-answer.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ------------------------------------------------------------------
    # Probes
    # ------------------------------------------------------------------

    location = /health {
        proxy_pass http://vanna_api/health;
        access_log off;
    }

    location = /ready {
        proxy_pass http://vanna_api/ready;
        access_log off;
    }

    # Metrics are for a scraper on the internal network, not for the public edge.
    # Blocked here rather than left to the API, because "reachable only from inside"
    # is a property of the ingress and should be stated at the ingress.
    location = /metrics {
        deny all;
        return 404;
    }

    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
}
