<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DataLens — Ask your data</title>

<!--
  The DataLens workspace.

  Six screens over one API: Ask (the chat), Schema, History, Saved queries,
  Dashboards, and the identity and workspace controls that tie them to a workspace.
  Everything is scoped to the workspace the user signed in to; the backend enforces
  that scoping and this page merely reflects it.

  Dependency-free on purpose. The only built asset is the <vanna-chat> web component
  bundle, loaded locally rather than from a CDN so the container runs the code in
  this repository. Adding a framework here would mean a second build pipeline to
  serve six screens that are mostly lists.

  Markup only. The stylesheet and the script live under /assets/, which is what
  allows a Content Security Policy without 'unsafe-inline' -- see frontend/nginx.conf.

  Identity is an httpOnly session cookie the page cannot read. Only the *workspace*
  travels as a header, and the server checks membership before honouring it: a header
  that selects a workspace is a preference, not a credential.
-->
<script type="module" src="/assets/vanna-components.js"></script>

<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>

<!--
  Skip link. The first thing in the document and visible only on focus, so a keyboard
  user can reach the content without tabbing through the whole navigation on every
  page load.
-->
<a class="skip-link" href="#main" data-i18n="a11y.skip">Skip to main content</a>

<!--
  Live regions. Answers stream in by mutating the DOM, which assistive technology
  does not report unless a region says it should -- without these a screen-reader
  user gets silence for however long the model takes and no signal that it finished.

  Two, because the priorities differ: `status` waits for a pause in speech, `alert`
  interrupts, and interrupting is right only for errors.
-->
<div id="a11y-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="a11y-alerts" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>

<!-- ------------------------------------------------------------ sign in -->
<div id="signin">
  <main class="panel">
    <h1 data-i18n="signin.title">Sign in to DataLens</h1>
    <p class="lede" data-i18n="signin.lede">Pick a workspace and identify yourself. Each
      workspace has its own database, its own members, and its own curated knowledge.</p>

    <form id="si-form" novalidate>
      <label for="si-tenant" data-i18n="signin.workspace">Workspace</label>
      <select id="si-tenant" name="tenant"></select>

      <label for="si-email" data-i18n="signin.email">Your email</label>
      <!-- dir=ltr: an address is not Arabic text, and mirroring it makes it
           unreadable. Same for the password field. -->
      <input id="si-email" name="email" type="email" placeholder="you@example.com"
             dir="ltr" autocomplete="email" required aria-describedby="si-error" />

      <label for="si-password" data-i18n="signin.password">Password</label>
      <input id="si-password" name="password" type="password" placeholder="********"
             dir="ltr" autocomplete="current-password" required aria-describedby="si-error" />

      <div class="roster" id="si-roster" role="group"
           data-i18n-attr="aria-label:signin.pickMember" aria-label="Pick a member"></div>

      <label class="sr-only" for="si-locale" data-i18n="header.language">Language</label>
      <select id="si-locale" class="locale-pick"
              data-i18n-attr="aria-label:header.language,title:header.language"
              aria-label="Language"></select>

      <button class="go" id="si-go" type="submit" data-i18n="signin.continue">Continue</button>

      <!-- Sign-in with an identity provider. Shown only when the deployment
           advertises it on /auth/methods. -->
      <a class="btn sso" id="si-sso" href="/api/vanna/v2/auth/oidc/login" hidden
         data-i18n="signin.sso">Sign in with single sign-on</a>

      <button class="link" id="si-forgot" type="button" hidden
              data-i18n="signin.forgot">Forgotten your password?</button>

      <!-- role=alert so a failure is spoken as soon as it appears rather than only
           when focus happens to land on it. -->
      <div class="error" id="si-error" role="alert" aria-live="assertive"></div>
    </form>
  </main>
</div>

<!-- --------------------------------------------------------------- app -->
<div id="app">
  <header class="top">
    <!-- Left of the brand, where every product with a collapsible rail puts it.
         `aria-expanded` and `aria-controls` are what make it a disclosure rather
         than an unlabelled icon. -->
    <button class="icon-btn" id="side-toggle" type="button" aria-controls="side"
            aria-expanded="true" data-i18n-attr="title:nav.collapse,aria-label:nav.collapse"
            title="Hide conversations">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <rect x="2.5" y="3.5" width="15" height="13" rx="2.5"
              stroke="currentColor" stroke-width="1.4" />
        <line x1="8" y1="3.5" x2="8" y2="16.5" stroke="currentColor" stroke-width="1.4" />
      </svg>
    </button>
    <span class="brand"><span class="dot" aria-hidden="true"></span> DataLens</span>

    <span class="grow"></span>

    <label class="sr-only" for="locale-btn" data-i18n="header.language">Language</label>
    <select id="locale-btn" class="locale-pick"
            data-i18n-attr="aria-label:header.language,title:header.language"
            aria-label="Language"></select>
    <button class="btn" id="theme-btn" type="button" data-i18n="header.theme"
            data-i18n-attr="title:header.themeTitle" title="Toggle light/dark">Theme</button>
  </header>

  <div class="body">
    <!-- The navigation is a tablist: one stop in the tab order, arrows to move
         within it. A row of buttons is not a tablist to a screen reader unless it
         behaves like one. -->
    <!-- The rail, in the order the eye needs it: what you can do, then what you
         have done. The section tabs are a tablist -- one stop in the tab order,
         arrows to move within it. A row of buttons is not a tablist to a screen
         reader unless it behaves like one.

         Every row carries an icon *and* a label. Collapsed, the labels go and the
         icons stay, so the rail keeps working at 60px instead of disappearing --
         which is the difference between narrowing the furniture and taking the
         navigation away. The label lives in its own span because `applyLocale`
         writes `textContent`, and on the button that would erase the icon. -->
    <nav class="side" id="side" data-i18n-attr="aria-label:a11y.sections" aria-label="Sections">
      <button class="new-chat" id="new-chat" type="button"
              data-i18n-attr="title:nav.newChat,aria-label:nav.newChat" title="New chat">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M4 13.5 13.1 4.4a1.9 1.9 0 0 1 2.7 2.7L6.7 16 3 17l1-3.5Z" />
        </svg>
        <span class="nav-text" data-i18n="nav.newChat">New chat</span>
      </button>

      <div class="views" role="tablist" data-i18n-attr="aria-label:a11y.sections" aria-label="Sections">
        <button data-view="ask" type="button" role="tab" aria-selected="true" aria-current="true"
                tabindex="0" data-i18n-attr="title:nav.ask,aria-label:nav.ask" title="Ask">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M3 9.2C3 6 6.1 3.5 10 3.5s7 2.5 7 5.7-3.1 5.8-7 5.8c-.8 0-1.6-.1-2.3-.3L4 16.4l.9-2.7A5.4 5.4 0 0 1 3 9.2Z" />
          </svg>
          <span class="nav-text" data-i18n="nav.ask">Ask</span>
        </button>
        <button data-view="schema" type="button" role="tab" aria-selected="false"
                tabindex="-1" data-i18n-attr="title:nav.schema,aria-label:nav.schema" title="Schema">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <rect x="3" y="3.5" width="14" height="13" rx="2" />
            <path d="M3 8h14M8 8v8.5" />
          </svg>
          <span class="nav-text" data-i18n="nav.schema">Schema</span>
        </button>
        <button data-view="history" type="button" role="tab" aria-selected="false"
                tabindex="-1" data-i18n-attr="title:nav.history,aria-label:nav.history" title="History">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="7" />
            <path d="M10 6v4.3l2.8 1.7" />
          </svg>
          <span class="nav-text" data-i18n="nav.history">History</span>
        </button>
        <button data-view="saved" type="button" role="tab" aria-selected="false"
                tabindex="-1" data-i18n-attr="title:nav.saved,aria-label:nav.saved" title="Saved queries">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M5.5 3.5h9v13L10 13l-4.5 3.5v-13Z" />
          </svg>
          <span class="nav-text" data-i18n="nav.saved">Saved queries</span>
        </button>
        <button data-view="dashboards" type="button" role="tab" aria-selected="false"
                tabindex="-1" data-i18n-attr="title:nav.dashboards,aria-label:nav.dashboards" title="Dashboards">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <rect x="3" y="3.5" width="6" height="6" rx="1.5" />
            <rect x="11" y="3.5" width="6" height="6" rx="1.5" />
            <rect x="3" y="11" width="6" height="5.5" rx="1.5" />
            <rect x="11" y="11" width="6" height="5.5" rx="1.5" />
          </svg>
          <span class="nav-text" data-i18n="nav.dashboards">Dashboards</span>
        </button>
        <button data-view="cubes" id="nav-cubes" type="button" role="tab" aria-selected="false"
                tabindex="-1" hidden data-i18n-attr="title:nav.metrics,aria-label:nav.metrics" title="Metrics">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M4 16.5V11M10 16.5V4.5M16 16.5v-8" />
          </svg>
          <span class="nav-text" data-i18n="nav.metrics">Metrics</span>
        </button>
        <button data-view="account" type="button" role="tab" aria-selected="false"
                tabindex="-1" data-i18n-attr="title:nav.account,aria-label:nav.account" title="Account">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="7.3" r="3.1" />
            <path d="M4.2 16.5a5.8 5.8 0 0 1 11.6 0" />
          </svg>
          <span class="nav-text" data-i18n="nav.account">Account</span>
        </button>
      </div>

      <div class="threads" id="threads">
        <label class="sr-only" for="thread-search" data-i18n="thread.search">Search conversations</label>
        <input id="thread-search" class="thread-search" type="search"
               data-i18n-attr="placeholder:thread.search,aria-label:thread.search"
               placeholder="Search conversations" />
        <p class="rail-label" id="thread-heading" data-i18n="thread.recents">Recents</p>
        <div id="thread-list" role="list"
             data-i18n-attr="aria-label:a11y.threads" aria-label="Conversations"></div>
        <button class="linkish" id="thread-more" type="button" hidden
                data-i18n="thread.loadMore">Load more</button>
      </div>

      <div class="spacer"></div>

      <!-- One control at the foot of the rail, the way every product with a
           sidebar ends it: who you are, and everything about this session behind
           it. The three loose notes that used to sit here -- admin console, plan,
           which database -- were unclickable text taking a quarter of the rail,
           and the identity they described was in the far corner of the header. -->
      <button class="rail-account" id="rail-account" type="button" aria-haspopup="dialog"
              data-i18n-attr="title:account.openMenu,aria-label:account.openMenu"
              title="Account, workspace and plan">
        <span class="avatar" id="rail-avatar" aria-hidden="true">--</span>
        <span class="who">
          <span class="line" id="rail-email">&mdash;</span>
          <span class="sub" id="rail-role"></span>
        </span>
      </button>
    </nav>

    <main id="main" class="flush" tabindex="-1">
      <!-- Ask keeps its own container so the chat element is never destroyed by a
           view switch; losing it would lose the conversation. -->
      <div id="view-ask" class="on" role="tabpanel"
           data-i18n-attr="aria-label:nav.ask" aria-label="Ask">
        <!-- Two columns beside the conversation, not a strip above it. As a
             horizontal row the starters pushed the chat down the page and wrapped
             onto a second line the moment a question was long, while the width
             either side of the card sat empty. A column also lets a question be a
             sentence rather than something that has to fit in a pill. -->
        <div class="ask-layout">
          <aside class="ask-side" id="ask-side"
                 data-i18n-attr="aria-label:ask.tryLead" aria-label="Try asking">
            <label class="rail-label" for="llm-effort" data-i18n="ask.effort">Reasoning effort</label>
            <select id="llm-effort" data-i18n-attr="title:ask.effortHelp"
                    title="Lower is faster; higher thinks longer before answering.">
              <option value="" data-i18n="ask.effortDefault">Server default</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>            </select>
            <p class="rail-label" id="starters-label" data-i18n="ask.tryLead" hidden>Try asking</p>
            <div class="starters" id="starters"></div>
            <div class="starters" id="ask-tools" hidden>
              <button class="starter" id="preview-prompt" type="button"
                      data-i18n-attr="title:ask.previewTitle"
                      title="What is the model actually told?"
                      data-i18n="ask.preview">Preview context</button>
            </div>
          </aside>
          <div class="chat-wrap" id="chat-wrap"></div>
        </div>
      </div>
      <div id="view-other" role="tabpanel" hidden></div>
    </main>
  </div>
</div>

<!-- --------------------------------------------------------- overlays -->
<!-- role=dialog + aria-modal so assistive technology treats the page behind as
     inert; the focus trap in shared/core.js enforces that for the keyboard. -->
<div class="overlay" id="overlay" aria-hidden="true">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/assets/app.js"></script>
</body>
</html>
