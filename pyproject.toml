# Tooling configuration. Not a package.
#
# There is no [build-system] and no [project] here, and that is the point: nothing
# in this repository is built, published or pip-installed. `backend/vanna/` and
# `backend/vanna_app/` are imported from source -- by uvicorn, by pytest, and by
# `python -m vanna` -- so the only thing a packaging table could add is a second
# description of the dependencies that `backend/requirements.txt` already pins, free
# to disagree with it.
#
# What used to be here, and where it went:
#
#   [project.dependencies]             -> backend/requirements.in
#   [project.optional-dependencies]    -> backend/requirements-dev.txt, or the
#                                         driver named in the error you get without
#                                         it (see vanna/cli/_runtime.py)
#   [project.scripts] vanna = ...      -> python -m vanna
#   [tool.flit.*]                      -> nothing; there is no build backend
#
# This file stays at the repository root rather than moving into backend/, because
# pytest and ruff run across the whole tree: the suite in backend/tests/ reads the frontend's
# pages as well as the backend's modules.

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Pinned rather than left to the default, which pytest-asyncio warns is changing.
# A fixture loop that silently changes scope between versions is a source of test
# flakiness that looks like an application bug.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
# One entry now: `backend/` holds both the library and the application package side
# by side, so a fresh checkout can run the suite with nothing but `pytest` -- no
# editable install, no PYTHONPATH in a shell profile somebody forgot to mention. It
# was ["src", "docker"] when those were two separate trees.
pythonpath = ["backend"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: needs a real PostgreSQL (VANNA_TEST_DATABASE_URL). Deselect with -m 'not integration'",
    "e2e: drives a real browser against a running stack (VANNA_E2E_URL). Needs playwright.",
    "anthropic: marks tests requiring Anthropic API key",
    "openai: marks tests requiring OpenAI API key",
    "azureopenai: marks tests requiring Azure OpenAI API key",
    "gemini: marks tests requiring Gemini API key",
    "ollama: marks tests requiring local Ollama instance",
    "legacy: marks tests for legacy adapter",
    "slow: costs an LLM call and tens of seconds; deselect with -m 'not slow'",
    "postgres: marks tests requiring PostgreSQL",
    "mysql: marks tests requiring MySQL",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
# Set the target Python version
target-version = "py310"

# Set line length to 88 (Black's default)
line-length = 88

# Enable auto-fixing
fix = false

# Exclude common directories
exclude = [
    ".git",
    ".tox",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    # The frontend is not Python, but node_modules is large enough that walking it
    # is the difference between a fast lint and a slow one.
    "frontend/node_modules",
    "frontend/dist",
]

[tool.ruff.lint]
# Enable specific rule categories
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    # "I",   # isort (disabled - use `ruff check --fix` to auto-fix import sorting)
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Ignore specific rules
ignore = [
    # Formatting/style (handled by formatter or not critical)
    "E501",  # line too long (handled by formatter)
    "E402",  # module level import not at top of file
    "E731",  # lambda assignment
    "E741",  # ambiguous variable name
    "W291",  # trailing whitespace
    "W293",  # blank line with whitespace

    # Naming conventions (legacy compatibility)
    "N801",  # invalid class name
    "N802",  # function name should be lowercase
    "N803",  # argument name should be lowercase
    "N805",  # invalid first argument name for method
    "N806",  # variable in function should be lowercase
    "N818",  # error suffix on exception name
    "N999",  # invalid module name

    # Unused/redefined (often intentional)
    "F401",  # imported but unused
    "F541",  # f-string missing placeholders
    "F811",  # redefinition of unused name
    "F841",  # unused variable

    # Bugbear rules (opinionated or intentional)
    "B006",  # mutable argument default (sometimes needed)
    "B007",  # unused loop control variable
    "B008",  # do not perform function calls in argument defaults
    "B024",  # abstract base class without abstract method
    "B027",  # empty method without abstract decorator
    "B904",  # raise without from inside except (intentional in legacy code)
    "B905",  # zip without explicit strict

    # Comprehension/collection style
    "C408",  # unnecessary collection call
    "C416",  # unnecessary comprehension

    # Simplification suggestions (all SIM rules - opinionated style)
    "SIM102", # collapsible if
    "SIM103", # needless bool
    "SIM105", # suppressible exception
    "SIM108", # if-else block instead of if-exp
    "SIM110", # reimplemented builtin
    "SIM114", # if with same arms
    "SIM117", # multiple with statements
    "SIM118", # in dict keys
    "SIM401", # if-else block instead of dict get
    "SIM910", # dict get with none default
]

# Allow fix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Automatically detect line endings
line-ending = "auto"
